name: PocketOS R1 - current KOReader boot chain + disposable UPT audit (NO FLASH)
on:
  push:
    branches: [reader-edition-koreader]
    paths:
      - '.github/workflows/pocketos-koreader-upt-boot-audit.yml'
      - '.github/workflows/pocketos-koreader-mips-build.yml'
      - '.github/workflows/pocketos-koreader-mips-ffi.yml'
      - 'reader/koreader/**'
      - 'tools/extract-r1-system-upt.py'
      - 'tools/build-r1-upt.py'
      - 'tools/koreader-r1-deep-offline-test.sh'
      - 'apps/pack-update.py'
      - 'tools/r1-koreader-loop-probe.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline-bootchain-and-upt:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install SquashFS, UPT and signature inspection tools with bounded retries
        timeout-minutes: 8
        run: |
          set -euo pipefail
          need=0
          for tool in unsquashfs 7z jq gh sha256sum openssl python3 genisoimage; do
            command -v "$tool" >/dev/null 2>&1 || need=1
          done
          if [ "$need" -eq 1 ]; then
            timeout 540 sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
              install -y --no-install-recommends squashfs-tools p7zip-full jq gh openssl python3 genisoimage coreutils
          fi
          for tool in unsquashfs 7z jq gh sha256sum openssl python3 genisoimage; do command -v "$tool"; done
      - name: Select latest successful current-source native KOReader candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Wait for the build triggered by the same source push; never audit
          # an older candidate just because the native build is still running.
          selected=0
          for attempt in $(seq 1 40); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pocketos-koreader-mips-build.yml/runs?branch=reader-edition-koreader&status=completed&per_page=50")" || {
              echo "GitHub Actions API read failed (attempt $attempt/40); retrying."
              sleep 30
              continue
            }
            while IFS=$'\t' read -r run_id head_sha; do
              [ -n "$run_id" ] || continue
              git merge-base --is-ancestor "$head_sha" "$GITHUB_SHA" || continue
              git diff --quiet "$head_sha" "$GITHUB_SHA" -- \
                .github/workflows/pocketos-koreader-mips-build.yml \
                .github/workflows/pocketos-koreader-mips-ffi.yml \
                reader/koreader/ \
                tools/extract-r1-system-upt.py \
                tools/build-r1-upt.py \
                tools/koreader-r1-deep-offline-test.sh \
                apps/pack-update.py || continue
              meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")" || continue
              jq -e --arg sha "$head_sha" '.status=="completed" and .conclusion=="success" and .head_branch=="reader-edition-koreader" and .head_sha==$sha and .path==".github/workflows/pocketos-koreader-mips-build.yml"' <<<"$meta" >/dev/null || continue
              artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")" || continue
              artifact="$(jq -c '[.artifacts[] | select(.name=="PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE" and .expired==false and (.digest|type=="string" and startswith("sha256:")))] | sort_by(.created_at) | last // empty' <<<"$artifacts")"
              [ -n "$artifact" ] || continue
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
              echo "artifact_id=$(jq -r .id <<<"$artifact")" >> "$GITHUB_OUTPUT"
              echo "artifact_digest=$(jq -r .digest <<<"$artifact")" >> "$GITHUB_OUTPUT"
              echo "Selected native candidate run $run_id at $head_sha; artifact $(jq -r .id <<<"$artifact"), digest $(jq -r .digest <<<"$artifact")"
              selected=1
              break
            done < <(jq -r '.workflow_runs[] | select(.status=="completed" and .conclusion=="success" and .head_branch=="reader-edition-koreader" and .path==".github/workflows/pocketos-koreader-mips-build.yml") | [.id,.head_sha] | @tsv' <<<"$runs")
            [ "$selected" -eq 1 ] && break
            echo "No successful native candidate matches current build inputs yet (attempt $attempt/40); waiting 30 seconds."
            sleep 30
          done
          [ "$selected" -eq 1 ] || { echo "::error::No successful native KOReader candidate matches current ABI/runtime/rootfs inputs after waiting"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: pinned
          digest-mismatch: error
      - name: Verify current candidate hashes, original KOReader frontend and protected SD runtime
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p report root sd
          report_json=pinned/reader-candidate/reader-edition-report.json
          root_image=pinned/reader-candidate/reader-rootfs.squashfs
          sd_image=pinned/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs
          jq -e --arg sha "$CANDIDATE_SHA" '.source_commit==$sha and
            .reader_edition==true and .only_visible_ui=="KOReader" and
            .sequence==6 and .rootfs_bytes<=16777216 and
            .installed_koreader_plugin_count>=37 and
            .bootloader_payload==false and .recovery_payload==false and
            .userdata_payload==false and .kernel_modified==false and
            .signed==false and .physical_boot_verified==false and .safe_to_flash==false and
            .sd_runtime_required==true and .sd_mount_noexec_preserved==true' "$report_json"
          echo "$(jq -r .rootfs_sha256 "$report_json")  $root_image" | sha256sum -c -
          echo "$(jq -r .sd_payload_sha256 "$report_json")  $sd_image" | sha256sum -c -
          test "$(stat -c %s "$root_image")" -eq "$(jq -r .rootfs_bytes "$report_json")"
          unsquashfs -no-progress -d root "$root_image" >report/root-unpack.txt
          unsquashfs -no-progress -d sd "$sd_image" >report/sd-unpack.txt
          for file in etc/inittab etc/init.d/rcS etc/init.d/S95pocketos etc/pocketos/autostart usr/bin/pocketos-start usr/sbin/pocketos-r1-boot usr/bin/pocketos-update usr/sbin/pocketos-recovery-arm etc/pocketos/update-public.pem etc/pocketos/koreader-sd.sha256 etc/pocketos/koreader-runtime-files.sha256; do
            test -e "root/$file" || { echo "Missing rootfs boot/recovery file: $file" >&2; exit 1; }
          done
          test -x root/usr/bin/pocketos-start
          grep -Fq '::sysinit:/etc/init.d/rcS' root/etc/inittab
          grep -Fq '/usr/bin/pocketos-start' root/etc/init.d/S95pocketos
          grep -Fq '/usr/bin/pocketos-start' root/usr/sbin/pocketos-r1-boot
          grep -Fq 'exec ./luajit ./reader.lua' root/usr/bin/pocketos-start
          grep -Fq 'KO_PLATFORM=hibyr1' root/usr/bin/pocketos-start
          grep -Fq 'sha256sum -c "$manifest"' root/usr/bin/pocketos-start
          grep -Fq 'mount -t squashfs -o ro,nosuid,nodev,loop,exec' root/usr/bin/pocketos-start
          for old in pocketos-shell pocketos-music pocketos-game pocketos-decoder; do test ! -e "root/usr/bin/$old"; done
          test -f sd/reader.lua
          test -f sd/frontend/device/hibyr1/device.lua
          grep -Fq 'linux_gnu_mipsel=' sd/ffi/posix_h.lua
          ! grep -Fq 'linux_mipsel=' sd/ffi/posix_h.lua
          test ! -e sd/plugins/zenos.koplugin
          test ! -e sd/plugins/gzreader.koplugin
          [ "$(find sd/plugins -mindepth 1 -maxdepth 1 -name '*.koplugin' -type d | wc -l)" -ge 37 ]
          sh -n root/usr/bin/pocketos-start
          sh -n root/etc/init.d/S95pocketos
          sh -n root/usr/sbin/pocketos-r1-boot
          sh -n tools/r1-koreader-loop-probe.sh
          test "$(sh tools/r1-koreader-loop-probe.sh --self-test)" = 'PocketOS KOReader R1 read-only hardware probe v1'
          expected="$(jq -r .sd_payload_sha256 "$report_json")  /mnt/sd_0/PocketOS/KOReaderRuntime/KOReader-R1-SD-RUNTIME.squashfs"
          test "$(cat root/etc/pocketos/koreader-sd.sha256)" = "$expected"
          echo 'PASS: current candidate boot/init chain, recovery tools, original KOReader, 37+ plugins, GNU MIPS ABI and protected SD manifest.' | tee report/bootchain.txt
      - name: Extract the pinned original kernel from immutable test-2 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original original-iso baseline
          gh release download pocketos-test-2 --repo "$GITHUB_REPOSITORY" --dir original --pattern pocketos-r1.upt
          echo '1ba912c86e50d699085657ee28b357db32b27b793b09bc1d0a9ca93c88899b80  original/pocketos-r1.upt' | sha256sum -c -
          7z x -y -ooriginal-iso original/pocketos-r1.upt >report/baseline-extract.log
          python3 tools/extract-r1-system-upt.py --extracted original-iso \
            --rootfs baseline/pocketos-rootfs.squashfs --kernel baseline/xImage \
            --rootfs-sha256 fd2a763277941163a8b52a767b3fdcfe96b3530107a6f72a30fe0ccce365da8a \
            --kernel-sha256 9222276c59d7bc9ffb8594106475b986bf66066c4f8f4db99c6fb34cb4fc64f6
      - name: Build and inspect disposable unsigned UPT structure without publishing
        run: |
          set -euo pipefail
          mkdir -p offline-upt report
          python3 - <<'PY'
          import importlib.util, json, pathlib
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location("upt", root/"tools/build-r1-upt.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          report = json.loads((root/"pinned/reader-candidate/reader-edition-report.json").read_text())
          c = {"image":{"sha256":report["rootfs_sha256"]},
               "primary_target":"/dev/mtd2 (rootfs)",
               "kernel_reused":True,"build_id":report["source_commit"][:16]}
          result = mod.package(
              root/"pinned/reader-candidate/reader-rootfs.squashfs", c,
              root/"offline-upt/iso-stage",
              root/"offline-upt/pocketos-r1.upt", root/"baseline/xImage")
          assert result["kernel_payload"] is True
          assert result["kernel_unchanged"] is True
          assert result["kernel_target_when_in_software_recovery"] == "/dev/mtd1"
          assert result["rootfs_target_when_in_software_recovery"] == "/dev/mtd2"
          assert all(result[n] is False for n in ("bootloader_payload","recovery_payload","userdata_payload"))
          (root/"report/unsigned-upt-layout.json").write_text(json.dumps(result,indent=2)+"\n")
          print("PASS: offline ISO 9660 UPT layout reuses the exact existing kernel; unsigned and never flashed")
          PY
          7z x -y -ooffline-upt/verify offline-upt/pocketos-r1.upt >report/upt-list-extract.log
          test -f offline-upt/verify/ota_v0/ota_update.in
          grep -Fxq 'img_type=kernel' offline-upt/verify/ota_v0/ota_update.in
          grep -Fxq 'img_type=rootfs' offline-upt/verify/ota_v0/ota_update.in
          test "$(find offline-upt/verify/ota_v0 -name 'xImage.*' | wc -l)" -ge 2
          test "$(find offline-upt/verify/ota_v0 -name 'rootfs.squashfs.*' | wc -l)" -ge 10
          echo 'PASS: UPT kernel/rootfs chunk layout and unchanged kernel hash.' >>report/bootchain.txt
      - name: Verify manifest format using a disposable CI-only RSA test key
        run: |
          set -euo pipefail
          umask 077
          test_key="$RUNNER_TEMP/koreader-manifest-unit-test.pem"
          test_public="$RUNNER_TEMP/koreader-manifest-unit-test-public.pem"
          trap 'rm -f "$test_key" "$test_public"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$test_key" 2>report/ephemeral-key-generation.log
          openssl pkey -in "$test_key" -pubout -out "$test_public"
          cp report/unsigned-upt-layout.json offline-upt/data-r1-report.json
          python3 apps/pack-update.py --firmware --sequence 6 --channel test --key "$test_key" \
            --output offline-upt/temporary-signature-test offline-upt/pocketos-r1.upt offline-upt/data-r1-report.json
          (
            cd offline-upt/temporary-signature-test
            test "$(head -n 1 manifest)" = 'POCKETOS-R1-SYSTEM-1 test r1-mipsel 6'
            openssl dgst -sha256 -verify "$test_public" -signature manifest.sig manifest
            tail -n +2 manifest | awk '{print $1 "  " $3}' | sha256sum -c -
          )
          cat >>report/bootchain.txt <<'EOF'
          PASS: disposable RSA test signature matches the SYSTEM-1 manifest.
          Test key is not the device trust key; no signed update is produced for installation.
          EOF
      - name: State remaining physical/signing gates
        if: always()
        run: |
          mkdir -p report
          cat >report/NO-FLASH.txt <<'EOF'
          This is a current-candidate offline boot-chain/UPT audit only.
          The staging UPT and disposable key are not uploaded.
          It does not prove physical R1 boot or production signing.
          Still required on hardware: kernel loop/SquashFS support, LCD pixels,
          touch/key mapping, RAM pressure, FAT32 noexec + read-only loop mount,
          production trusted-key validation, recovery and rollback.
          No OTA channel, firmware, key or recovery data was changed.
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: KOReader-R1-CURRENT-CANDIDATE-BOOTCHAIN-REPORT-NOT-FIRMWARE
          path: report/
          retention-days: 14
          if-no-files-found: warn
