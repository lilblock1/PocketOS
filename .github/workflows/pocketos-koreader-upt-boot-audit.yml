name: PocketOS R1 - standard KOReader boot chain + disposable UPT audit (NO FLASH)
on:
  push:
    branches: [reader-edition-koreader]
    paths:
      - '.github/workflows/pocketos-koreader-upt-boot-audit.yml'
      - 'tools/r1-koreader-loop-probe.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline-bootchain-and-upt:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use existing SquashFS tooling and obtain ISO generator (not a flasher)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for tool in unsquashfs 7z jq gh sha256sum openssl python3; do command -v "$tool"; done
          if ! command -v genisoimage >/dev/null; then
            timeout 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=25 \
              install -y --no-install-recommends genisoimage
          fi
          command -v genisoimage
      - name: Select latest successful current-source native KOReader candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pocketos-koreader-mips-build.yml/runs?branch=reader-edition-koreader&status=completed&per_page=50")"
          selected=0
          while IFS='|' read -r run_id head_sha; do
            [ -n "$run_id" ] || continue
            git merge-base --is-ancestor "$head_sha" "$GITHUB_SHA" || continue
            git diff --quiet "$head_sha" "$GITHUB_SHA" -- \
              .github/workflows/pocketos-koreader-mips-build.yml \
              .github/workflows/pocketos-koreader-mips-ffi.yml \
              reader/koreader/normalize-mips-posix.py \
              reader/koreader/prepare-upstream.py \
              reader/koreader/overlay \
              reader/koreader/boot/pocketos-reader-start.sh \
              reader/koreader/r1-touch-probe.c \
              reader/koreader/build-reader-rootfs.py || continue
            meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            jq -e --arg sha "$head_sha" '.status=="completed" and .conclusion=="success" and .head_branch=="reader-edition-koreader" and .head_sha==$sha and .path==".github/workflows/pocketos-koreader-mips-build.yml"' <<<"$meta" >/dev/null || continue
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
            artifact="$(jq -c '[.artifacts[] | select(.name=="PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE" and .expired==false and (.digest|type=="string" and startswith("sha256:")))] | sort_by(.created_at) | last // empty' <<<"$artifacts")"
            [ -n "$artifact" ] || continue
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$(jq -r .id <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "artifact_digest=$(jq -r .digest <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "Selected native candidate run $run_id at $head_sha; artifact $(jq -r .id <<<"$artifact"), digest $(jq -r .digest <<<"$artifact")"
            selected=1
            break
          done < <(jq -r '.workflow_runs[] | select(.status=="completed" and .conclusion=="success" and .head_branch=="reader-edition-koreader" and .path==".github/workflows/pocketos-koreader-mips-build.yml") | "\(.id)|\(.head_sha)"' <<<"$runs")
          [ "$selected" -eq 1 ] || { echo "::error::No successful native KOReader candidate matches current ABI/runtime/rootfs sources"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: pinned
          digest-mismatch: error
      - name: Verify hashes, init chain, KOReader-only visible frontend, signed recovery tools
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p report root sd
          jq -e --arg sha "$CANDIDATE_SHA" '.source_commit==$sha and .reader_edition==true and .only_visible_ui=="KOReader" and
                 .sequence==6 and .rootfs_bytes<=16777216 and
                 .installed_koreader_plugin_count>=37 and
                 .bootloader_payload==false and .recovery_payload==false and
                 .userdata_payload==false and .signed==false and
                 .physical_boot_verified==false and .safe_to_flash==false' pinned/reader-candidate/reader-edition-report.json
          echo "$(jq -r .rootfs_sha256 pinned/reader-candidate/reader-edition-report.json)  pinned/reader-candidate/reader-rootfs.squashfs" | sha256sum -c -
          echo "$(jq -r .sd_payload_sha256 pinned/reader-candidate/reader-edition-report.json)  pinned/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs" | sha256sum -c -
          unsquashfs -no-progress -d root pinned/reader-candidate/reader-rootfs.squashfs >report/root-unpack.txt
          unsquashfs -no-progress -d sd pinned/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs >report/sd-unpack.txt
          test -f root/etc/inittab
          test -f root/etc/init.d/rcS
          test -f root/etc/init.d/S95pocketos
          test -f root/etc/pocketos/autostart
          test -x root/usr/bin/pocketos-start
          test -x root/usr/sbin/pocketos-r1-boot
          test -x root/usr/bin/pocketos-update
          test -x root/usr/sbin/pocketos-recovery-arm
          test -f root/etc/pocketos/update-public.pem
          test -f root/etc/pocketos/koreader-sd.sha256
          test -f root/etc/pocketos/koreader-runtime-files.sha256
          grep -Fq '::sysinit:/etc/init.d/rcS' root/etc/inittab
          grep -Fq '/usr/bin/pocketos-start' root/etc/init.d/S95pocketos
          grep -Fq '/usr/bin/pocketos-start' root/usr/sbin/pocketos-r1-boot
          grep -Fq 'KOReader-R1-SD-RUNTIME.squashfs' root/usr/bin/pocketos-start
          grep -Fq 'exec ./luajit ./reader.lua' root/usr/bin/pocketos-start
          grep -Fq 'KO_PLATFORM=hibyr1' root/usr/bin/pocketos-start
          grep -Fq 'sha256sum -c "$manifest"' root/usr/bin/pocketos-start
          grep -Fq 'mount -t squashfs -o ro,nosuid,nodev,loop,exec' root/usr/bin/pocketos-start
          for old in pocketos-shell pocketos-music pocketos-game pocketos-decoder; do
            test ! -e "root/usr/bin/$old"
          done
          test -f sd/reader.lua
          test -f sd/frontend/device/hibyr1/device.lua
          grep -Fq 'linux_gnu_mipsel=' sd/ffi/posix_h.lua
          test ! -e sd/plugins/zenos.koplugin
          test ! -e sd/plugins/gzreader.koplugin
          [ "$(find sd/plugins -mindepth 1 -maxdepth 1 -name '*.koplugin' -type d | wc -l)" -ge 37 ]
          sh -n root/usr/bin/pocketos-start
          sh -n root/etc/init.d/S95pocketos
          sh -n root/usr/sbin/pocketos-r1-boot
          sh -n tools/r1-koreader-loop-probe.sh
          test "$(sh tools/r1-koreader-loop-probe.sh --self-test)" = 'PocketOS KOReader R1 read-only hardware probe v1'
          actual="$(cat root/etc/pocketos/koreader-sd.sha256)"
          expected="$(jq -r .sd_payload_sha256 pinned/reader-candidate/reader-edition-report.json)  /mnt/sd_0/PocketOS/KOReaderRuntime/KOReader-R1-SD-RUNTIME.squashfs"
          test "$actual" = "$expected"
          echo 'PASS: packaged R1 init+autostart, standard KOReader sole UI, correct protected SD digest and recovery tools.' >report/bootchain.txt
      - name: Extract pinned original kernel for simulated R1 legacy UPT packing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original original-iso baseline
          gh release download pocketos-test-2 --repo "$GITHUB_REPOSITORY" --dir original --pattern pocketos-r1.upt
          echo '1ba912c86e50d699085657ee28b357db32b27b793b09bc1d0a9ca93c88899b80  original/pocketos-r1.upt' | sha256sum -c -
          7z x -y -ooriginal-iso original/pocketos-r1.upt >report/baseline-extract.log
          python3 tools/extract-r1-system-upt.py --extracted original-iso \
            --rootfs baseline/pocketos-rootfs.squashfs --kernel baseline/xImage \
            --rootfs-sha256 fd2a763277941163a8b52a767b3fdcfe96b3530107a6f72a30fe0ccce365da8a \
            --kernel-sha256 9222276c59d7bc9ffb8594106475b986bf66066c4f8f4db99c6fb34cb4fc64f6
      - name: Build and inspect *unsigned*, offline-only UPT structure; do NOT publish UPT
        run: |
          set -euo pipefail
          mkdir -p offline-upt report
          python3 - <<'PY'
          import importlib.util, json, pathlib
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location("upt", root/"tools/build-r1-upt.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          report = json.loads((root/"pinned/reader-candidate/reader-edition-report.json").read_text())
          c = {"image":{"sha256":report["rootfs_sha256"]},
               "primary_target":"/dev/mtd2 (rootfs)",
               "kernel_reused":True,"build_id":report["source_commit"][:16]}
          result = mod.package(
              root/"pinned/reader-candidate/reader-rootfs.squashfs", c,
              root/"offline-upt/iso-stage",
              root/"offline-upt/pocketos-r1.upt", root/"baseline/xImage")
          assert result["kernel_payload"] is True
          assert result["kernel_unchanged"] is True
          assert result["kernel_target_when_in_software_recovery"] == "/dev/mtd1"
          assert result["rootfs_target_when_in_software_recovery"] == "/dev/mtd2"
          assert all(result[n] is False for n in ("bootloader_payload","recovery_payload","userdata_payload"))
          (root/"report/unsigned-upt-layout.json").write_text(json.dumps(result,indent=2)+"\n")
          print("PASS: offline ISO 9660 R1 kernel/rootfs payload layout; UNSIGNED, NEVER FLASH")
          PY
          7z x -y -ooffline-upt/verify offline-upt/pocketos-r1.upt >report/upt-list-extract.log
          test -f offline-upt/verify/ota_v0/ota_update.in
          grep -Fxq 'img_type=kernel' offline-upt/verify/ota_v0/ota_update.in
          grep -Fxq 'img_type=rootfs' offline-upt/verify/ota_v0/ota_update.in
          test "$(find offline-upt/verify/ota_v0 -name 'xImage.*' | wc -l)" -ge 2
          test "$(find offline-upt/verify/ota_v0 -name 'rootfs.squashfs.*' | wc -l)" -ge 10
          echo 'PASS: kernel/rootfs chunks present; original kernel hash is unchanged.' >>report/bootchain.txt
      - name: Validate signed SYSTEM-1 manifest with a disposable CI-only test key
        run: |
          set -euo pipefail
          umask 077
          # This key is freshly generated, NOT the PocketOS device update key.
          # No signed file or private key is uploaded or accepted by the R1.
          test_key="$RUNNER_TEMP/koreader-manifest-unit-test.pem"
          test_public="$RUNNER_TEMP/koreader-manifest-unit-test-public.pem"
          trap 'rm -f "$test_key" "$test_public"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$test_key" 2>report/ephemeral-key-generation.log
          openssl pkey -in "$test_key" -pubout -out "$test_public"
          cp report/unsigned-upt-layout.json offline-upt/data-r1-report.json
          python3 apps/pack-update.py \
            --firmware --sequence 6 --channel test --key "$test_key" \
            --output offline-upt/temporary-signature-test \
            offline-upt/pocketos-r1.upt offline-upt/data-r1-report.json
          (
            cd offline-upt/temporary-signature-test
            test "$(head -n 1 manifest)" = 'POCKETOS-R1-SYSTEM-1 test r1-mipsel 6'
            openssl dgst -sha256 -verify "$test_public" -signature manifest.sig manifest
            tail -n +2 manifest | awk '{print $1 "  " $3}' | sha256sum -c -
          )
          cat >>report/bootchain.txt <<'EOF'
          PASS: ephemeral RSA unit-test signature matches PocketOS SYSTEM-1 manifest.
          The disposable test key does NOT match the device's trusted public key.
          This is NOT an installable signed update.
          EOF
      - name: State remaining physical/signing gates explicitly
        if: always()
        run: |
          mkdir -p report
          cat >report/NO-FLASH.txt <<'EOF'
          This job inspects KOReader boot/init and a disposable legacy UPT layout.
          UNSIGNED staging ISO is NEVER uploaded and is deleted with the runner.
          It does not prove a physical R1 can boot KOReader.
          Need: real R1 kernel loop + SquashFS, /dev/fb0 and touch tests,
          ~57 MiB memory budget, signed update/recovery and confirmed rollback.
          No Wi-Fi OTA or active firmware channel is touched.
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: KOReader-R1-COLD-BOOT-CHAIN-UPT-LAYOUT-REPORT-NOT-FIRMWARE
          path: report/
          retention-days: 14
\t' read -r run_id head_sha; do
            [ -n "$run_id" ] || continue
            git merge-base --is-ancestor "$head_sha" "$GITHUB_SHA" || continue
            git diff --quiet "$head_sha" "$GITHUB_SHA" -- \
              .github/workflows/pocketos-koreader-mips-build.yml \
              .github/workflows/pocketos-koreader-mips-ffi.yml \
              reader/koreader/normalize-mips-posix.py \
              reader/koreader/prepare-upstream.py \
              reader/koreader/overlay \
