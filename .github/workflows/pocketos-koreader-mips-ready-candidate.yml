name: PocketOS R1 - verify canonical native KOReader candidate (UNSIGNED, NO FLASH)
on:
  push:
    branches: [reader-edition-koreader]
    paths:
      - '.github/workflows/pocketos-koreader-mips-ready-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-current-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install QEMU and image inspection tools with bounded retries
        timeout-minutes: 10
        run: |
          set -euo pipefail
          need=0
          for tool in qemu-mipsel mksquashfs unsquashfs 7z readelf jq gh sha256sum tar; do
            command -v "$tool" >/dev/null 2>&1 || need=1
          done
          if [ "$need" -eq 1 ]; then
            timeout 540 sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
              install -y --no-install-recommends qemu-user squashfs-tools p7zip-full binutils jq gh
          fi
          for tool in qemu-mipsel unsquashfs 7z readelf jq gh sha256sum tar; do command -v "$tool"; done
      - name: Select latest successful current-source native KOReader candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pocketos-koreader-mips-build.yml/runs?branch=reader-edition-koreader&status=completed&per_page=50")"
          selected=0
          while IFS='|' read -r run_id head_sha; do
            [ -n "$run_id" ] || continue
            git merge-base --is-ancestor "$head_sha" "$GITHUB_SHA" || continue
            git diff --quiet "$head_sha" "$GITHUB_SHA" -- \
              .github/workflows/pocketos-koreader-mips-build.yml \
              .github/workflows/pocketos-koreader-mips-ffi.yml \
              reader/koreader/normalize-mips-posix.py \
              reader/koreader/prepare-upstream.py \
              reader/koreader/overlay \
              reader/koreader/boot/pocketos-reader-start.sh \
              reader/koreader/r1-touch-probe.c \
              reader/koreader/build-reader-rootfs.py || continue
            meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            jq -e --arg sha "$head_sha" '.status=="completed" and .conclusion=="success" and .head_branch=="reader-edition-koreader" and .head_sha==$sha and .path==".github/workflows/pocketos-koreader-mips-build.yml"' <<<"$meta" >/dev/null || continue
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
            artifact="$(jq -c '[.artifacts[] | select(.name=="PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE" and .expired==false and (.digest|type=="string" and startswith("sha256:")))] | sort_by(.created_at) | last // empty' <<<"$artifacts")"
            [ -n "$artifact" ] || continue
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$(jq -r .id <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "artifact_digest=$(jq -r .digest <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "Selected native candidate run $run_id at $head_sha; artifact $(jq -r .id <<<"$artifact"), digest $(jq -r .digest <<<"$artifact")"
            selected=1
            break
          done < <(jq -r '.workflow_runs[] | select(.status=="completed" and .conclusion=="success" and .head_branch=="reader-edition-koreader" and .path==".github/workflows/pocketos-koreader-mips-build.yml") | "\(.id)|\(.head_sha)"' <<<"$runs")
          [ "$selected" -eq 1 ] || { echo "::error::No successful native KOReader candidate matches current ABI/runtime/rootfs sources"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: candidate
          digest-mismatch: error
      - name: Verify candidate report, hashes, ABI, plugins and rootfs size
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p root runtime report
          report_json=candidate/reader-candidate/reader-edition-report.json
          root_image=candidate/reader-candidate/reader-rootfs.squashfs
          sd_image=candidate/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs
          jq -e --arg sha "$CANDIDATE_SHA" '.source_commit==$sha and
            .reader_edition==true and .only_visible_ui=="KOReader" and .sequence==6 and
            .installed_koreader_plugin_count>=37 and .rootfs_bytes<=16777216 and
            .removed_other_user_interfaces==true and .signed==false and .safe_to_flash==false and
            .physical_boot_verified==false and .sd_runtime_required==true and
            .sd_mount_noexec_preserved==true and .bootloader_payload==false and
            .recovery_payload==false and .userdata_payload==false and .kernel_modified==false' "$report_json"
          echo "$(jq -r .rootfs_sha256 "$report_json")  $root_image" | sha256sum -c -
          echo "$(jq -r .sd_payload_sha256 "$report_json")  $sd_image" | sha256sum -c -
          test "$(stat -c %s "$root_image")" -eq "$(jq -r .rootfs_bytes "$report_json")"
          unsquashfs -no-progress -d root "$root_image" >report/root-unpack.txt
          unsquashfs -no-progress -d runtime "$sd_image" >report/runtime-unpack.txt
          test -f runtime/reader.lua
          test -f runtime/frontend/device/hibyr1/device.lua
          test "$(find runtime/plugins -mindepth 1 -maxdepth 1 -type d -name '*.koplugin' | wc -l)" -ge 37
          test ! -e runtime/plugins/gzreader.koplugin
          test ! -e runtime/plugins/zenos.koplugin
          grep -Fq 'linux_gnu_mipsel=' runtime/ffi/posix_h.lua
          ! grep -Fq 'linux_mipsel=' runtime/ffi/posix_h.lua
          test "$(cat root/etc/pocketos/koreader-sd.sha256)" = "$(jq -r .sd_payload_sha256 "$report_json")  /mnt/sd_0/PocketOS/KOReaderRuntime/KOReader-R1-SD-RUNTIME.squashfs"
          echo 'PASS: canonical candidate provenance, original KOReader identity, 37+ plugins, generated GNU MIPS ABI and 16 MiB rootfs limit.' | tee report/summary.txt
      - name: Re-run native MIPS QEMU checks on canonical candidate
        run: |
          set -euo pipefail
          bash tools/koreader-r1-deep-offline-test.sh root runtime report
          (
            cd runtime
            export KO_PLATFORM=hibyr1
            export KO_HOME="$GITHUB_WORKSPACE/KOReader-QEMU-Profile"
            export LD_LIBRARY_PATH="$PWD/libs:$PWD"
            mkdir -p "$KO_HOME"
            timeout 75 qemu-mipsel -L "$GITHUB_WORKSPACE/root" ./luajit ./reader.lua -h
          ) 2>&1 | tee report/reader-entry-help.txt
          grep -Eq 'usage:|Usage:|Read all the books' report/reader-entry-help.txt
          echo 'PASS: current candidate native MIPS QEMU integration; no physical boot claim.' >>report/summary.txt
      - name: Record hardware-only gates
        if: always()
        run: |
          mkdir -p report
          cat >report/PHYSICAL-GATES-REMAIN.txt <<'EOF'
          This workflow verifies the current candidate produced by pocketos-koreader-mips-build.yml.
          It does not assemble or publish firmware and does not prove a physical R1 boot.
          Hardware still required: cold boot, LCD pixels, touch/key mapping, R1 loop/SquashFS,
          FAT32 noexec + read-only loop mount, RAM pressure, production signing, recovery and rollback.
          No OTA channel, trusted key, firmware or recovery partition was changed.
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: KOReader-R1-CANONICAL-CANDIDATE-VERIFY-REPORT-NOT-FIRMWARE
          path: report/
          retention-days: 14
          if-no-files-found: warn
