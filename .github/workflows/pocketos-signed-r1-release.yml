name: PocketOS R1 signed pre-release
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful PocketOS applications workflow run ID
        required: true
        type: string
      sequence:
        description: New firmware sequence (strictly increasing)
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: pocketos-r1-signed-release
  cancel-in-progress: false
jobs:
  signed-release:
    if: github.repository == 'lilblock1/PocketOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: pocketos-release
    env:
      SOURCE_RUN: ${{ inputs.source_run }}
      SEQUENCE: ${{ inputs.sequence }}
      PREVIEW_ID: '757071177'
      PREVIEW_SHA256: fa36d95736555dba9ce95e33a29227668270d524f1cb419a751506f59d10a074
    steps:
      - name: Fetch only the verified build and pinned draft preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/pocketos-release/kit"
          cd "$RUNNER_TEMP/pocketos-release"
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]{0,19}$ && "$SEQUENCE" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "$SEQUENCE" -gt 2 ]] || { echo "Sequence 2 already published"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .conclusion=="success" and .status=="completed" and
            .path==".github/workflows/pocketos-apps.yml" and
            .head_branch=="phase5-r1-updater" and .head_repository.full_name==$repo
          ' run.json >/dev/null
          SOURCE_COMMIT=$(jq -er '.head_sha | select(test("^[a-f0-9]{40}$"))' run.json)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > artifacts.json
          jq -e '[.artifacts[] | select(.name=="PocketOS-R1-updater-bootstrap-kit-NOT-FIRMWARE" and .expired==false)] | length==1' artifacts.json >/dev/null
          KIT_ID=$(jq -er '.artifacts[] | select(.name=="PocketOS-R1-updater-bootstrap-kit-NOT-FIRMWARE" and .expired==false) | .id' artifacts.json)
          KIT_SHA256=$(jq -er '.artifacts[] | select(.id=='"$KIT_ID"') | .digest | select(test("^sha256:[a-f0-9]{64}$")) | sub("^sha256:";"")' artifacts.json)
          printf 'SOURCE_COMMIT=%s\n' "$SOURCE_COMMIT" >> "$GITHUB_ENV"
          if gh release view "test-$SEQUENCE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Versioned release already exists; refusing to overwrite"
            exit 1
          fi
          # Keep a verified copy of the current rolling release for an archive.
          mkdir previous
          gh release download test-latest --repo "$GITHUB_REPOSITORY" --dir previous \
            --pattern manifest --pattern manifest.sig --pattern pocketos-r1.upt --pattern data-r1-report.json
          read -r magic channel target old extra < previous/manifest
          [[ "$magic" == POCKETOS-R1-FW-1 && "$channel" == test && "$target" == r1-mipsel && -z "$extra" && "$old" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "$SEQUENCE" -gt "$old" ]] || { echo "Sequence must exceed current test-latest"; exit 1; }
          printf 'PREVIOUS_SEQUENCE=%s\n' "$old" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$KIT_ID/zip" -o kit.zip
          echo "$KIT_SHA256  kit.zip" | sha256sum -c -
          unzip -q kit.zip -d kit
          test "$(cat kit/SOURCE_COMMIT)" = "$SOURCE_COMMIT"
          (cd kit && sha256sum -c SHA256SUMS)
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$PREVIEW_ID" -o preview.upt
          echo "$PREVIEW_SHA256  preview.upt" | sha256sum -c -
      - name: Install offline packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 openssl p7zip-full squashfs-tools genisoimage binutils
      - name: Sign and verify new firmware
        env:
          RELEASE_KEY: ${{ secrets.POCKETOS_RELEASE_KEY }}
          PREFLIGHT_LOG: ${{ secrets.POCKETOS_PREFLIGHT_LOG }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_KEY" && test -n "$PREFLIGHT_LOG" || { echo "Configure both environment secrets first"; exit 1; }
          work="$RUNNER_TEMP/pocketos-release"
          export HOME="$work/signing-home"
          mkdir -p "$HOME/.local/share/pocketos-signing" "$work/publish"
          key="$HOME/.local/share/pocketos-signing/release-private.pem"
          trap 'rm -f "$key" "$work/preflight.log"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          printf '%s\n' "$PREFLIGHT_LOG" > "$work/preflight.log"
          unset RELEASE_KEY PREFLIGHT_LOG
          chmod 600 "$key"
          openssl pkey -in "$key" -check -noout >/dev/null
          tr -d '\r' < "$work/preflight.log" | grep -Fxq POCKETOS-R1-RECOVERY-PREFLIGHT-OK
          cd "$work/kit"
          openssl pkey -in "$key" -pubout -out "$work/public.pem"
          # A mismatched signing secret must never publish an unusable release.
          (cd "$work/previous"; openssl dgst -sha256 -verify "$work/public.pem" -signature manifest.sig manifest
           tail -n +2 manifest | awk '{print $1 "  " $3}' | sha256sum -c -)
          bash finalize-r1-bootstrap.sh "$work/preflight.log" "$work/preview.upt" "$SEQUENCE"
          shopt -s nullglob
          candidates=("$HOME"/pocketos-bootstrap.*/signed)
          test "${#candidates[@]}" = 1
          signed="${candidates[0]}"
          openssl pkey -in "$key" -pubout -out "$work/public.pem"
          cd "$signed"
          openssl dgst -sha256 -verify "$work/public.pem" -signature manifest.sig manifest
          test "$(head -n 1 manifest)" = "POCKETOS-R1-FW-1 test r1-mipsel $SEQUENCE"
          tail -n +2 manifest | awk '{print $1 "  " $3}' | sha256sum -c -
          cp manifest manifest.sig pocketos-r1.upt data-r1-report.json "$work/publish/"
      - name: Publish the signed pre-release only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pocketos-release"
          release_notes="Signed rootfs-only HiBy R1 test firmware, sequence $SEQUENCE. Source: $SOURCE_COMMIT. Automated tests passed; physical boot and Wi-Fi install require verification. Keep microSD inserted and preserve stock recovery."
          # Archive the old rolling assets before modifying the rolling channel.
          if ! gh release view "test-$PREVIOUS_SEQUENCE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            old_commit=$(gh release view test-latest --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            [[ "$old_commit" =~ ^[a-f0-9]{40}$ ]] || old_commit="$SOURCE_COMMIT"
            (cd "$work/previous"; gh release create "test-$PREVIOUS_SEQUENCE" manifest manifest.sig pocketos-r1.upt data-r1-report.json \
              --repo "$GITHUB_REPOSITORY" --target "$old_commit" --draft --prerelease \
              --title "PocketOS R1 — Sequence $PREVIOUS_SEQUENCE (archive)" --notes "Archived signed test release.")
            gh release edit "test-$PREVIOUS_SEQUENCE" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          fi
          cd "$work/publish"
          # Versioned pre-release is complete before updating the rolling channel.
          gh release create "test-$SEQUENCE" manifest manifest.sig pocketos-r1.upt data-r1-report.json \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --draft --prerelease \
            --title "PocketOS R1 — Sequence $SEQUENCE (experimental)" --notes "$release_notes"
          gh release edit "test-$SEQUENCE" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          # GitHub asset replacement is not atomic. Old/new mixed assets fail
          # signature or checksum verification; publish the manifest last.
          gh release upload test-latest pocketos-r1.upt data-r1-report.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload test-latest manifest.sig --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload test-latest manifest --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit test-latest --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "PocketOS R1 — Sequence $SEQUENCE (experimental)" --notes "$release_notes"
          mkdir "$work/published"
          gh release download test-latest --repo "$GITHUB_REPOSITORY" --dir "$work/published" \
            --pattern manifest --pattern manifest.sig --pattern pocketos-r1.upt --pattern data-r1-report.json
          for name in manifest manifest.sig pocketos-r1.upt data-r1-report.json; do cmp "$name" "$work/published/$name"; done
      - name: Remove signing workspace
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/pocketos-release"
