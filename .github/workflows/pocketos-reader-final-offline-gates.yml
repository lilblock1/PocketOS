name: PocketOS KOReader R1 - final offline hardware-preflight gates (NOT FIRMWARE)
on:
  push:
    branches: [reader-edition-koreader]
    paths:
      - '.github/workflows/pocketos-reader-final-offline-gates.yml'
      - 'tools/koreader-r1-deep-offline-test.sh'
      - 'tools/r1-koreader-mips-ffi-diagnostic.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact reader-edition branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install only missing host tools with bounded retries (no firmware writers)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          need_install=0
          for cmd in qemu-mipsel unsquashfs readelf mount jq gh; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              need_install=1
            fi
          done
          if [ "$need_install" -eq 1 ]; then
            timeout 540 sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
              install -y --no-install-recommends qemu-user squashfs-tools binutils util-linux jq gh
          fi
          for cmd in qemu-mipsel unsquashfs readelf mount jq gh; do command -v "$cmd"; done
      - name: Authenticate exact corrected KOReader candidate, QEMU run and boot audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_run=44460649797
          candidate_sha=f2ed849682cdd6ca076f7a5d2a954a179a7079cb
          qemu_run=44460728655
          qemu_sha=672a18bec0e0512675e96c6bd24c16189667ba03
          audit_run=44460896960
          audit_sha=8e0662876f5c84b0f04210878e1c674b7e156506

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run" |
            jq -e --arg sha "$candidate_sha" '
              .status=="completed" and .conclusion=="success" and
              .head_branch=="reader-edition-koreader" and .head_sha==$sha and
              .path==".github/workflows/pocketos-koreader-mips-ready-candidate.yml"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$qemu_run" |
            jq -e --arg sha "$qemu_sha" '
              .status=="completed" and .conclusion=="success" and
              .head_branch=="reader-edition-koreader" and .head_sha==$sha and
              .path==".github/workflows/pocketos-koreader-new-image-qemu.yml"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$audit_run" |
            jq -e --arg sha "$audit_sha" '
              .status=="completed" and .conclusion=="success" and
              .head_branch=="reader-edition-koreader" and .head_sha==$sha and
              .path==".github/workflows/pocketos-koreader-upt-boot-audit.yml"'

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run/artifacts" |
            jq -e '[.artifacts[]|select(
              .id==14500046462 and
              .name=="KOReader-R1-CORRECTED-MIPS-SD-AND-ROOTFS-NOT-FIRMWARE" and
              .digest=="sha256:e6115bb624cc19249fbcd5752ee21732620acb8b3437a9ce7c99c8ed1cfd787b" and
              .expired==false)]|length==1'

          git merge-base --is-ancestor "$candidate_sha" "$GITHUB_SHA"
          # Permit only runner action-version changes in the ABI workflow;
          # any changed ABI pin, generator, normalization or assertion invalidates
          # this candidate and requires a fresh native build and QEMU run.
          git show "$candidate_sha":.github/workflows/pocketos-koreader-mips-ffi.yml |
            sed -E '/uses: actions\/(checkout|upload-artifact)@v[0-9]+/d' > /tmp/ffi-candidate.yml
          sed -E '/uses: actions\/(checkout|upload-artifact)@v[0-9]+/d' \
            .github/workflows/pocketos-koreader-mips-ffi.yml > /tmp/ffi-current.yml
          cmp -s /tmp/ffi-candidate.yml /tmp/ffi-current.yml || {
            echo "::error::MIPS ABI generator changed beyond runner action versions; rebuild and retest."
            exit 1
          }
          git diff --quiet "$candidate_sha" "$GITHUB_SHA" -- \
            .github/workflows/pocketos-koreader-mips-build.yml \
            .github/workflows/pocketos-koreader-mips-ready-candidate.yml \
            reader/koreader/normalize-mips-posix.py \
            reader/koreader/prepare-upstream.py \
            reader/koreader/overlay \
            reader/koreader/boot/pocketos-reader-start.sh \
            reader/koreader/r1-touch-probe.c \
            reader/koreader/build-reader-rootfs.py \
            tools/koreader-r1-deep-offline-test.sh || {
              echo "::error::The pinned QEMU candidate is stale relative to native/ABI sources; rebuild and retest before using it."
              exit 1
            }
          echo "Candidate, QEMU and boot-chain provenance verified; runtime source files unchanged."
      - uses: actions/download-artifact@v8
        with:
          name: KOReader-R1-CORRECTED-MIPS-SD-AND-ROOTFS-NOT-FIRMWARE
          run-id: 44460649797
          github-token: ${{ github.token }}
          path: verified
      - name: Verify original rootfs/SD hashes and extract authentic images
        run: |
          set -euo pipefail
          mkdir -p extracted/root extracted/runtime report
          sha_root=$(jq -r '.rootfs_sha256' verified/candidate/reader-edition-report.json)
          sha_sd=$(jq -r '.sd_payload_sha256' verified/candidate/reader-edition-report.json)
          printf '%s  %s\n' "$sha_root" verified/candidate/reader-rootfs.squashfs | sha256sum -c -
          printf '%s  %s\n' "$sha_sd" verified/candidate/KOReader-R1-SD-RUNTIME.squashfs | sha256sum -c -
          jq -e '.reader_edition==true and .only_visible_ui=="KOReader" and
                  .sequence==6 and .installed_koreader_plugin_count>=37 and
                  .removed_other_user_interfaces==true and
                  .physical_boot_verified==false and .safe_to_flash==false and
                  .signed==false and .sd_runtime_required==true and
                  .sd_mount_noexec_preserved==true and .kernel_modified==false and
                  .bootloader_payload==false and .recovery_payload==false and
                  .userdata_payload==false and .rootfs_bytes<=16777216' verified/candidate/reader-edition-report.json
          unsquashfs -no-progress -d extracted/root verified/candidate/reader-rootfs.squashfs >report/root-extract.txt
          unsquashfs -no-progress -d extracted/runtime verified/candidate/KOReader-R1-SD-RUNTIME.squashfs >report/runtime-extract.txt
          printf '%s  /mnt/sd_0/PocketOS/KOReaderRuntime/KOReader-R1-SD-RUNTIME.squashfs\n' "$sha_sd" |
            cmp - extracted/root/etc/pocketos/koreader-sd.sha256
          echo "PASS: signed-update trust remains separate; pinned candidate images and protected SD manifest match"
      - name: Deep MIPS ABI / graphical module / boot-chain tests under QEMU user mode
        run: |
          set -euo pipefail
          bash tools/koreader-r1-deep-offline-test.sh extracted/root extracted/runtime report
      - name: Inventory further MIPS FFI problems in a temporary, explicitly nonshipping CI copy
        if: always()
        run: |
          if [ -d extracted/root ] && [ -d extracted/runtime ]; then
            bash tools/r1-koreader-mips-ffi-diagnostic.sh extracted/root extracted/runtime report
          else
            echo 'Skipped: candidate not extracted'
          fi
      - name: Attempt read-only SquashFS loop mount on GitHub runner (NOT an R1 test)
        if: always()
        run: |
          set -u
          mkdir -p report host-loop-mount
          if [ ! -f verified/candidate/KOReader-R1-SD-RUNTIME.squashfs ]; then
            echo "NOT RUN: candidate missing" | tee report/host-loop.txt
            exit 0
          fi
          if sudo mount -t squashfs -o ro,nosuid,nodev,loop,exec verified/candidate/KOReader-R1-SD-RUNTIME.squashfs host-loop-mount 2>report/host-loop-error.txt; then
            if grep -Fq ' /host-loop-mount ' /proc/mounts; then
              echo 'GitHub runner mounted read-only image (different kernel and loop implementation)' | tee report/host-loop.txt
            else
              echo 'GitHub runner mounted image; verifying mountpoint' | tee report/host-loop.txt
            fi
            test -f host-loop-mount/reader.lua || echo 'WARNING: reader.lua missing in host loop mount' | tee -a report/host-loop.txt
            sudo umount host-loop-mount
          else
            echo "UNVERIFIED: GitHub runner does not permit image loop mount; this is not an R1 failure" | tee report/host-loop.txt
          fi
      - name: State unresolved real-hardware gates and save complete report
        if: always()
        run: |
          mkdir -p report
          cat > report/REAL-HARDWARE-REQUIRED.txt <<'EOF'
          Experimental KOReader R1 image: NOT SAFE TO FLASH.
          Offline QEMU tests are USERSPACE tests, NOT MIPS board/kernel boot.
          A host Ubuntu loop mount does not validate kernel 4.4.94-sonix.
          Still need physical checks on EXISTING working PocketOS over ADB:
          - SquashFS and loop support, read-only loop mount, MIPS runtime run
          - /dev/fb0 RGB pixel format, framebuffer mmap and drawing
          - touchscreen event identity and axis mapping, hardware keys
          - RAM and storage pressure, repeated cold start, EPUB/PDF/CBZ/plugins
          - signed update package, correct partition layout, recovery and rollback
          DO NOT INSTALL reader-rootfs.squashfs or SD SquashFS as firmware.
          No update-channel or recovery changes are performed by this CI.
          EOF
      - name: Upload even if tests uncover a blocker
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: KOReader-R1-FINAL-OFFLINE-GATES-REPORT-NOT-FIRMWARE
          path: report/
          if-no-files-found: warn
          retention-days: 14
