name: PocketOS KOReader R1 - final offline hardware-preflight gates (NOT FIRMWARE)
on:
  push:
    branches: [reader-edition-koreader]
    paths:
      - '.github/workflows/pocketos-reader-final-offline-gates.yml'
      - '.github/workflows/pocketos-koreader-mips-build.yml'
      - '.github/workflows/pocketos-koreader-mips-ffi.yml'
      - '.github/workflows/pocketos-koreader-signed-stage.yml'
      - 'reader/koreader/**'
      - 'tools/extract-r1-system-upt.py'
      - 'tools/build-r1-upt.py'
      - 'tools/koreader-r1-deep-offline-test.sh'
      - 'tools/r1-koreader-mips-ffi-diagnostic.sh'
      - 'tools/r1-koreader-loop-probe.sh'
      - 'apps/pack-update.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact reader-edition branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install only missing host tools with bounded retries (no firmware writers)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          need_install=0
          for cmd in qemu-mipsel unsquashfs readelf mount umount sha256sum cmp stat timeout jq gh; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              need_install=1
            fi
          done
          if [ "$need_install" -eq 1 ]; then
            timeout 540 sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
              install -y --no-install-recommends qemu-user squashfs-tools binutils util-linux coreutils jq gh
          fi
          for cmd in qemu-mipsel unsquashfs readelf mount umount sha256sum cmp stat timeout jq gh; do command -v "$cmd"; done
      - name: Guard candidate freshness filters against native build trigger drift
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path(".github/workflows/pocketos-koreader-mips-build.yml").read_text()
          gate = Path(".github/workflows/pocketos-reader-final-offline-gates.yml").read_text()
          signed = Path(".github/workflows/pocketos-koreader-signed-stage.yml").read_text()

          def trigger_paths(text, label):
              lines = text.splitlines()
              try:
                  paths_at = lines.index("    paths:")
                  dispatch_at = lines.index("  workflow_dispatch:", paths_at)
              except ValueError as exc:
                  raise AssertionError(f"{label}: cannot find push path list") from exc
              paths = []
              for line in lines[paths_at + 1:dispatch_at]:
                  if line.startswith("      - '") and line.endswith("'"):
                      paths.append(line[9:-1])
              assert paths, f"{label}: empty push path list"
              return paths

          def selector_paths(text, label):
              marker = 'git diff --quiet "$head_sha" "$GITHUB_SHA" -- '
              assert marker in text, f"{label}: candidate freshness selector missing"
              start = text.index("\n", text.rindex(marker)) + 1
              end = text.index("|| continue", start)
              paths = []
              for line in text[start:end].splitlines():
                  item = line.strip()
                  if item.endswith("\\"):
                      item = item[:-1].strip()
                  if item:
                      paths.append(item)
              assert paths, f"{label}: empty candidate freshness selector"
              return paths

          def normalize(path):
              if path.endswith("/**"):
                  path = path[:-3]
              return path.rstrip("/")

          expected = {normalize(path) for path in trigger_paths(build, "native build")}
          for label, workflow in (("final offline gate", gate), ("signed-stage gate", signed)):
              actual = {normalize(path) for path in selector_paths(workflow, label)}
              assert actual == expected, (
                  f"{label} freshness selector drifted from native build inputs; "
                  f"missing={sorted(expected - actual)}, extra={sorted(actual - expected)}"
              )
          print("PASS: final offline and signed-stage selectors cover every native build/assembly input")
          PY
      - name: Select latest successful current-source native KOReader candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pocketos-koreader-mips-build.yml/runs?branch=reader-edition-koreader&status=completed&per_page=50")"
          selected=0
          while IFS=$'\t' read -r run_id head_sha; do
            [ -n "$run_id" ] || continue
            git merge-base --is-ancestor "$head_sha" "$GITHUB_SHA" || continue
            # Keep this set aligned with the native build workflow's push paths.
            # Compare the entire KOReader tree and every build/assembly input so
            # newly added source files cannot be missed by a stale-artifact gate.
            git diff --quiet "$head_sha" "$GITHUB_SHA" -- \
              .github/workflows/pocketos-koreader-mips-build.yml \
              .github/workflows/pocketos-koreader-mips-ffi.yml \
              reader/koreader/ \
              tools/extract-r1-system-upt.py \
              tools/build-r1-upt.py \
              tools/koreader-r1-deep-offline-test.sh \
              apps/pack-update.py || continue
            meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            jq -e --arg sha "$head_sha" '.status=="completed" and .conclusion=="success" and .head_branch=="reader-edition-koreader" and .head_sha==$sha and .path==".github/workflows/pocketos-koreader-mips-build.yml"' <<<"$meta" >/dev/null || continue
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
            artifact="$(jq -c '[.artifacts[] | select(.name=="PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE" and .expired==false and (.digest|type=="string" and startswith("sha256:")))] | sort_by(.created_at) | last // empty' <<<"$artifacts")"
            [ -n "$artifact" ] || continue
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$(jq -r .id <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "artifact_digest=$(jq -r .digest <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "Selected native candidate run $run_id at $head_sha; artifact $(jq -r .id <<<"$artifact"), digest $(jq -r .digest <<<"$artifact")"
            selected=1
            break
          done < <(jq -r '.workflow_runs[] | select(.status=="completed" and .conclusion=="success" and .head_branch=="reader-edition-koreader" and .path==".github/workflows/pocketos-koreader-mips-build.yml") | [.id,.head_sha] | @tsv' <<<"$runs")
          [ "$selected" -eq 1 ] || { echo "::error::No successful native KOReader candidate matches current ABI/runtime/rootfs sources"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: verified
          digest-mismatch: error
      - name: Verify original rootfs/SD hashes and extract authentic images
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p extracted/root extracted/runtime report
          sha_root=$(jq -r '.rootfs_sha256' verified/reader-candidate/reader-edition-report.json)
          sha_sd=$(jq -r '.sd_payload_sha256' verified/reader-candidate/reader-edition-report.json)
          printf '%s  %s\n' "$sha_root" verified/reader-candidate/reader-rootfs.squashfs | sha256sum -c -
          printf '%s  %s\n' "$sha_sd" verified/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs | sha256sum -c -
          jq -e --arg sha "$CANDIDATE_SHA" '.source_commit==$sha and .reader_edition==true and .only_visible_ui=="KOReader" and
                  .sequence==6 and .installed_koreader_plugin_count>=37 and
                  .removed_other_user_interfaces==true and
                  .physical_boot_verified==false and .safe_to_flash==false and
                  .signed==false and .sd_runtime_required==true and
                  .sd_mount_noexec_preserved==true and .kernel_modified==false and
                  .bootloader_payload==false and .recovery_payload==false and
                  .userdata_payload==false and .rootfs_bytes<=16777216' verified/reader-candidate/reader-edition-report.json
          unsquashfs -no-progress -d extracted/root verified/reader-candidate/reader-rootfs.squashfs >report/root-extract.txt
          unsquashfs -no-progress -d extracted/runtime verified/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs >report/runtime-extract.txt
          printf '%s  /mnt/sd_0/PocketOS/KOReaderRuntime/KOReader-R1-SD-RUNTIME.squashfs\n' "$sha_sd" |
            cmp - extracted/root/etc/pocketos/koreader-sd.sha256
          echo "PASS: signed-update trust remains separate; pinned candidate images and protected SD manifest match"
      - name: Deep MIPS ABI / graphical module / boot-chain tests under QEMU user mode
        run: |
          set -euo pipefail
          bash tools/koreader-r1-deep-offline-test.sh extracted/root extracted/runtime report
      - name: Inventory further MIPS FFI problems in a temporary, explicitly nonshipping CI copy
        if: always()
        run: |
          if [ -d extracted/root ] && [ -d extracted/runtime ]; then
            bash tools/r1-koreader-mips-ffi-diagnostic.sh extracted/root extracted/runtime report
          else
            echo 'Skipped: candidate not extracted'
          fi
      - name: Attempt read-only SquashFS loop mount on GitHub runner (NOT an R1 test)
        if: always()
        run: |
          set -u
          mkdir -p report host-loop-mount
          if [ ! -f verified/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs ]; then
            echo "NOT RUN: candidate missing" | tee report/host-loop.txt
            exit 0
          fi
          if sudo mount -t squashfs -o ro,nosuid,nodev,loop,exec verified/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs host-loop-mount 2>report/host-loop-error.txt; then
            if grep -Fq ' /host-loop-mount ' /proc/mounts; then
              echo 'GitHub runner mounted read-only image (different kernel and loop implementation)' | tee report/host-loop.txt
            else
              echo 'GitHub runner mounted image; verifying mountpoint' | tee report/host-loop.txt
            fi
            test -f host-loop-mount/reader.lua || echo 'WARNING: reader.lua missing in host loop mount' | tee -a report/host-loop.txt
            sudo umount host-loop-mount
          else
            echo "UNVERIFIED: GitHub runner does not permit image loop mount; this is not an R1 failure" | tee report/host-loop.txt
          fi
      - name: State unresolved real-hardware gates and save complete report
        if: always()
        run: |
          mkdir -p report
          cat > report/REAL-HARDWARE-REQUIRED.txt <<'EOF'
          Experimental KOReader R1 image: NOT SAFE TO FLASH.
          Offline QEMU tests are USERSPACE tests, NOT MIPS board/kernel boot.
          A host Ubuntu loop mount does not validate kernel 4.4.94-sonix.
          Still need physical checks on EXISTING working PocketOS over ADB:
          - SquashFS and loop support, read-only loop mount, MIPS runtime run
          - /dev/fb0 RGB pixel format, framebuffer mmap and drawing
          - touchscreen event identity and axis mapping, hardware keys
          - RAM and storage pressure, repeated cold start, EPUB/PDF/CBZ/plugins
          - signed update package, correct partition layout, recovery and rollback
          DO NOT INSTALL reader-rootfs.squashfs or SD SquashFS as firmware.
          No update-channel or recovery changes are performed by this CI.
          EOF
      - name: Upload even if tests uncover a blocker
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: KOReader-R1-FINAL-OFFLINE-GATES-REPORT-NOT-FIRMWARE
          path: report/
          if-no-files-found: warn
          retention-days: 14
