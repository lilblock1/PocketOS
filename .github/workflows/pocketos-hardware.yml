name: PocketOS - R1 hardware compatibility audit
on:
  push:
    branches: [main]
    paths: ['hardware/hiby-r1/**', 'apps/**', 'tools/r1_hardware_audit.py', 'tools/r1_stage.py', 'tools/test_r1_stage.py', 'tools/r1_init_plan.py', 'tools/test_r1_init_plan.py', 'tools/r1_boot_gate.py', 'tools/test_r1_boot_gate.py', 'tools/select_sdk.py', '.github/workflows/pocketos-hardware.yml']
  workflow_dispatch:
    inputs:
      foundation_run_id:
        description: Successful foundation run (blank = latest available)
        required: false
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: pocketos-r1-hardware
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install reference inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full squashfs-tools kmod python3-pil fonts-dejavu-core
      - name: Select existing successful foundation
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.foundation_run_id }}
          REQUIRE_SDK: '0'
        run: python3 tools/select_sdk.py
      - name: Reuse verified Phase 1 root filesystem artifact
        uses: actions/download-artifact@v4
        with:
          name: PocketOS-0.1.0-alpha-foundation-NOT-FIRMWARE
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ github.token }}
          path: previous-foundation
      - name: Verify previous foundation and reference identity
        run: |
          (cd previous-foundation && sha256sum --check SHA256SUMS)
          cmp boards/hiby-r1/reference.json previous-foundation/reference.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('previous-foundation')
          report=json.loads((p/'compatibility.json').read_text())
          assert not report['flashable'] and report['fp_abi_matches']
          fs=p/'PocketOS-rootfs-NOT-FIRMWARE.tar.gz'
          assert hashlib.sha256(fs.read_bytes()).hexdigest()==report['candidate_tar_gz']['sha256']
          PY
      - name: Inspect original board support without executing it
        run: |
          url=$(python3 -c 'import json;print(json.load(open("boards/hiby-r1/reference.json"))["reference"]["url"])')
          curl --fail --location --retry 3 "$url" -o reference.upt
          python3 tools/extract_reference.py reference.upt boards/hiby-r1/reference.json reference-work
          sudo unsquashfs -no-progress -no-xattrs -d reference-work/root reference-work/reference.squashfs
          mkdir -p hardware-report
          sudo python3 tools/r1_hardware_audit.py reference-work/root previous-foundation/compatibility.json hardware-report/r1-compatibility.json
          sudo chown "$(id -u):$(id -g)" hardware-report/r1-compatibility.json
          sh -n hardware/hiby-r1/probe.sh
          cp hardware/hiby-r1/probe.sh hardware/hiby-r1/README.md hardware-report/
      - name: Unit-test offline hardware staging
        run: python3 -m unittest discover -s tools -p 'test_r1_*.py'
      - name: Test R1 runtime services on synthetic hardware
        run: make -C apps BUILD_DIR="$PWD/host-runtime" check
      - name: Assemble and verify non-flashable R1 development tree (runner only)
        run: |
          mkdir -p staging/rootfs
          sudo tar --numeric-owner -xzf previous-foundation/PocketOS-rootfs-NOT-FIRMWARE.tar.gz -C staging/rootfs
          sudo python3 tools/r1_stage.py reference-work/root hardware-report/r1-compatibility.json previous-foundation/compatibility.json staging hardware/hiby-r1/probe.sh hardware-report/r1-integration.json
          sudo chown "$(id -u):$(id -g)" hardware-report/r1-integration.json
          sudo sh -n staging/rootfs/usr/sbin/pocketos-r1-probe
          sudo python3 tools/r1_init_plan.py staging hardware-report/r1-integration.json hardware-report/r1-init-plan.json
          sudo chown "$(id -u):$(id -g)" hardware-report/r1-init-plan.json
          sudo sh -n staging/rootfs/usr/sbin/pocketos-r1-init-draft
          sudo sh staging/rootfs/usr/sbin/pocketos-r1-init-draft --plan > hardware-report/r1-module-order.txt
          if sudo sh staging/rootfs/usr/sbin/pocketos-r1-init-draft --apply; then
            echo "Unsafe draft allowed application" >&2
            exit 1
          fi
          # Scratch image is never placed in the artifact directory.
          sudo mksquashfs staging/rootfs staging/rootfs-size-only.squashfs -noappend -comp lzo -processors 2 -no-progress >/dev/null
          sudo python3 tools/r1_boot_gate.py staging/rootfs reference-work/reference.squashfs staging/rootfs-size-only.squashfs staging/reference-kernel.bin hardware-report/r1-integration.json hardware-report/r1-init-plan.json hardware-report/r1-boot-readiness.json
          sudo chown "$(id -u):$(id -g)" hardware-report/r1-boot-readiness.json
          sh -n hardware/hiby-r1/boot-probe.sh
          cp hardware/hiby-r1/boot-probe.sh hardware/hiby-r1/recovery.md hardware-report/
          sudo rm -rf staging
      - name: Upload report and physical-device read-only probe
        uses: actions/upload-artifact@v4
        with:
          name: PocketOS-phase2-R1-hardware-report-NOT-FIRMWARE
          path: hardware-report/
          if-no-files-found: error
          retention-days: 14
