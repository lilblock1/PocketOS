name: PocketOS R1 correct installed-updater firmware manifest
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pocketos-r1-fw-v4-manifest-fix.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: pocketos-signed-test-latest
  cancel-in-progress: false
jobs:
  repair-firmware-release:
    if: github.repository == 'lilblock1/PocketOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: pocketos-release
    env:
      GH_TOKEN: ${{ github.token }}
      SEQUENCE: '4'
      SOURCE_TAG: v0.3.0.100-test
      EXPECTED_UPT_SHA: 655d884fb2ff6657a7482941f9e0a5ac3071eeb9e45aaf8c798ac4d62e27cfc7
      EXPECTED_UPT_BYTES: '47929344'
      SOURCE_RUN: '44016903950'
      SOURCE_SHA: cbbffa44142e5d7a32214acf4401c5c31b20a281
      INSTALLED_UPDATER_SHA: '1b872bb90d8e59a70fd77446e240493a710bada7'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable R1 boot candidate and existing channel
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .status=="completed" and .conclusion=="success" and
            .head_sha==$sha and .head_repository.full_name==$repo and
            .path==".github/workflows/pocketos-r1-sd-candidate.yml"
          ' run.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_TAG" > source.json
          jq -e --arg hash "sha256:$EXPECTED_UPT_SHA" --argjson size "$EXPECTED_UPT_BYTES" '
            .prerelease==true and .draft==false and
            ([.assets[]|select(.name=="r1.upt" and .state=="uploaded" and
              .digest==$hash and .size==$size)]|length)==1
          ' source.json
          if gh release view test-4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Test-4 already exists; refusing to replace"
            exit 1
          fi
          mkdir source current
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir source --pattern r1.upt
          mv source/r1.upt source/pocketos-r1.upt
          echo "$EXPECTED_UPT_SHA  source/pocketos-r1.upt" | sha256sum -c -
          test "$(stat -c%s source/pocketos-r1.upt)" = "$EXPECTED_UPT_BYTES"
          test $((EXPECTED_UPT_BYTES%2048)) -eq 0
          gh release download test-latest --repo "$GITHUB_REPOSITORY" \
            --dir current --pattern manifest --pattern manifest.sig \
            --pattern pocketos-r1.upt
          test "$(head -n1 current/manifest)" = 'POCKETOS-SD-1 test r1-mipsel 3'
      - name: Generate correct legacy firmware manifest and independently verify it
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.POCKETOS_RELEASE_KEY }}
          PREFLIGHT_LOG: ${{ secrets.POCKETOS_PREFLIGHT_LOG }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_KEY" && test -n "$PREFLIGHT_LOG" || {
            echo 'Release signing / preflight secrets unavailable'; exit 1;
          }
          printf '%s\n' "$PREFLIGHT_LOG" | tr -d '\r' |
            grep -Fxq 'POCKETOS-R1-RECOVERY-PREFLIGHT-OK'
          key="$RUNNER_TEMP/release-private.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          chmod 600 "$key"
          openssl pkey -in "$key" -check -noout >/dev/null
          openssl pkey -in "$key" -pubout -out public.pem
          openssl dgst -sha256 -verify public.pem \
            -signature current/manifest.sig current/manifest
          mkdir signed
          cp source/pocketos-r1.upt signed/pocketos-r1.upt
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          folder=Path('signed')
          image=folder/'pocketos-r1.upt'
          assert image.stat().st_size==int(os.environ['EXPECTED_UPT_BYTES'])
          assert hashlib.sha256(image.read_bytes()).hexdigest()==os.environ['EXPECTED_UPT_SHA']
          report={
            'device':'HiBy R1',
            'sequence':4,
            'version':'v0.3.0.100-test',
            'source_release':'lilblock1/PocketOS',
            'source_run':44016903950,
            'image_sha256':os.environ['EXPECTED_UPT_SHA'],
            'kernel_from_verified_reference_unchanged':True,
            'rootfs_bytes':44568576,
            'reference_rootfs_bytes':44564480,
            'reference_rootfs_delta_bytes':4096,
            'physical_boot_verified':False,
            'partition_capacity_physically_verified':False,
            'recovery_write_targets_verified':False,
            'firmware_installation_tested':False,
            'important':'Unverified experimental firmware. Can fail to boot; physical recovery not established. PocketOS UI binary is separate on microSD.'
          }
          (folder/'data-r1-report.json').write_text(json.dumps(report,indent=2)+'\n')
          assert (folder/'data-r1-report.json').stat().st_size<=32768
          rows=['POCKETOS-R1-FW-1 test r1-mipsel 4']
          for filename in ('pocketos-r1.upt','data-r1-report.json'):
            p=folder/filename
            rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()} {p.stat().st_size} {filename}')
          (folder/'manifest').write_text('\n'.join(rows)+'\n')
          print((folder/'manifest').read_text())
          PY
          openssl dgst -sha256 -sign "$key" \
            -out signed/manifest.sig signed/manifest
          openssl dgst -sha256 -verify public.pem \
            -signature signed/manifest.sig signed/manifest
          (cd signed; tail -n +2 manifest | awk '{print $1 "  " $3}' |
            sha256sum -c -)
          test "$(head -n1 signed/manifest)" = 'POCKETOS-R1-FW-1 test r1-mipsel 4'
          test "$(wc -l < signed/manifest)" -eq 3
          # Test actual phase5 updater source from the version used for R1 firmware.
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$INSTALLED_UPDATER_SHA/apps/pocketos-update.sh" \
            -o installed-pocketos-update.sh
          sh -n installed-pocketos-update.sh
          mkdir -p fixture
          sh installed-pocketos-update.sh --fixture "$PWD/fixture" "$PWD/public.pem" \
            sd "$PWD/signed"
          test -f fixture/PocketOS-updates/versions/4/pocketos-r1.upt
          test -f fixture/PocketOS-updates/versions/4/data-r1-report.json
          test "$(cat fixture/PocketOS-updates/selection)" = '4 0 4'
          # Validate the same signed payload against old BusyBox awk as well.
          busybox awk -v fixture=0 '
            NR==1 {if(NF!=4||$1!="POCKETOS-R1-FW-1"||
              $2!="test"||$3!="r1-mipsel"||$4!="4")exit 1;firmware=1;next}
            {if(NF!=3||length($1)!=64||$1!~/^[0-9a-f]+$/||
              $2!~/^[1-9][0-9]*$/||$3!~/^(pocketos-|data-)[a-zA-Z0-9][a-zA-Z0-9._-]*$/)exit 1
              if($3=="pocketos-r1.upt"){if($2>50331648||$2%2048!=0)exit 1;upt=1}
              else if($3=="data-r1-report.json"){if($2>32768)exit 1;report=1}
              else exit 1}
            END {if(NR!=3||!upt||!report)exit 1}
          ' signed/manifest
      - name: Publish corrected test-4 and replace PocketOS rolling test-latest
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          PocketOS R1 sequence 4 - corrected signed firmware manifest.

          Fixes "Invalid signed manifest format" on the Phase 5 R1 updater:
          POCKETOS-R1-FW-1 test r1-mipsel 4, and both required image/report
          assets. Manifest and image are signed and verified, and the
          installed updater's exact parser passed the fixture test.

          WARNING: physical HiBy R1 boot and recovery are NOT verified.
          Flashing may fail, and recovery write targets are not proven safe.
          The PocketOS UI executable remains in the separate
          PocketOS-R1-SD-Boot-Test.zip file of v0.3.0.100-test, not inside
          the minimal firmware rootfs. Without the SD files and marker,
          the original player starts.

          Previous rolling Sequence 2 is archived as test-2.
          Sequence 3 used an incompatible SD-only manifest and must not
          be used with the R1 firmware updater.
          EOF
          (cd signed; gh release create test-4 \
            manifest manifest.sig pocketos-r1.upt data-r1-report.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title \
            'PocketOS R1 sequence 4 - corrected experimental Wi-Fi firmware' \
            --notes-file ../notes.md)
          # Manifest last: during clobber mixed artifacts fail verification.
          gh release upload test-latest signed/pocketos-r1.upt \
            signed/data-r1-report.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload test-latest signed/manifest.sig \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload test-latest signed/manifest \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit test-latest --repo "$GITHUB_REPOSITORY" \
            --prerelease --title 'PocketOS R1 sequence 4 - firmware manifest fixed' \
            --notes-file notes.md
      - name: Verify public rolling release matches signed candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download test-latest --repo "$GITHUB_REPOSITORY" \
            --dir published --pattern manifest --pattern manifest.sig \
            --pattern pocketos-r1.upt --pattern data-r1-report.json
          for item in manifest manifest.sig pocketos-r1.upt data-r1-report.json; do
            cmp "signed/$item" "published/$item"
          done
          openssl dgst -sha256 -verify public.pem \
            -signature published/manifest.sig published/manifest
          (cd published; tail -n +2 manifest |
            awk '{print $1 "  " $3}' | sha256sum -c -)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/test-latest" > live.json
          jq -e '
            .prerelease==true and .draft==false and
            ([.assets[]|select(.name=="manifest" and .state=="uploaded")]|length)==1 and
            ([.assets[]|select(.name=="manifest.sig" and .state=="uploaded")]|length)==1 and
            ([.assets[]|select(.name=="pocketos-r1.upt" and .state=="uploaded")]|length)==1 and
            ([.assets[]|select(.name=="data-r1-report.json" and .state=="uploaded")]|length)==1
          ' live.json
