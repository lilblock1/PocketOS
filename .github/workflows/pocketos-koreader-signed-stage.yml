name: PocketOS R1 - prepare STANDARD KOReader signed offline stage (MANUAL; NO FLASH)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type STAGE-ONLY to create an unpublished image after real R1 preflight
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  ko-reader-offline-signing-only:
    if: github.repository == 'lilblock1/PocketOS' && github.ref == 'refs/heads/reader-edition-koreader' && inputs.confirmation == 'STAGE-ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: pocketos-release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install candidate verification tools with bounded retries
        timeout-minutes: 8
        run: |
          set -euo pipefail
          need=0
          for tool in gh jq qemu-mipsel 7z unsquashfs openssl python3 sha256sum genisoimage; do
            command -v "$tool" >/dev/null 2>&1 || need=1
          done
          if [ "$need" -eq 1 ]; then
            timeout 240 sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=40 update
            timeout 600 sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=40 install -y --no-install-recommends \
              gh jq qemu-user p7zip-full squashfs-tools openssl python3 coreutils genisoimage
          fi
          for tool in gh jq qemu-mipsel 7z unsquashfs openssl python3 sha256sum genisoimage; do command -v "$tool"; done
      - name: Select latest successful native candidate built from unchanged KOReader sources
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pocketos-koreader-mips-build.yml/runs?branch=reader-edition-koreader&status=completed&per_page=50")"
          selected=0
          while IFS=$'\t' read -r run_id head_sha; do
            [ -n "$run_id" ] || continue
            git merge-base --is-ancestor "$head_sha" "$GITHUB_SHA" || continue
            git diff --quiet "$head_sha" "$GITHUB_SHA" -- \
              .github/workflows/pocketos-koreader-mips-build.yml \
              .github/workflows/pocketos-koreader-mips-ffi.yml \
              reader/koreader/normalize-mips-posix.py \
              reader/koreader/prepare-upstream.py \
              reader/koreader/overlay \
              reader/koreader/boot/pocketos-reader-start.sh \
              reader/koreader/r1-touch-probe.c \
              reader/koreader/build-reader-rootfs.py || continue
            meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            jq -e --arg sha "$head_sha" \
              '.status=="completed" and .conclusion=="success" and
               .head_branch=="reader-edition-koreader" and .head_sha==$sha and
               .path==".github/workflows/pocketos-koreader-mips-build.yml"' \
              <<<"$meta" >/dev/null || continue
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
            artifact="$(jq -c '[.artifacts[] |
              select(.name=="PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE" and
                     .expired==false and (.digest|type=="string" and startswith("sha256:")))] |
              sort_by(.created_at) | last // empty' <<<"$artifacts")"
            [ -n "$artifact" ] || continue
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$(jq -r .id <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "artifact_digest=$(jq -r .digest <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "Selected native candidate from run $run_id at $head_sha; digest $(jq -r .digest <<<"$artifact")"
            selected=1
            break
          done < <(jq -r '.workflow_runs[] |
            select(.status=="completed" and .conclusion=="success" and
                   .head_branch=="reader-edition-koreader" and
                   .path==".github/workflows/pocketos-koreader-mips-build.yml") |
            [.id,.head_sha] | @tsv' <<<"$runs")
          [ "$selected" -eq 1 ] || {
            echo "::error::No successful native candidate matches current KOReader ABI/runtime/rootfs sources"
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          name: PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: verified
          digest-mismatch: error
      - name: Check original KOReader-only image and target resource budget
        run: |
          set -euo pipefail
          for cmd in 7z unsquashfs openssl python3 sha256sum qemu-mipsel jq gh genisoimage; do command -v "$cmd"; done
          jq -e '.only_visible_ui=="KOReader" and .sequence==6 and
                 .reader_edition==true and .installed_koreader_plugin_count>=37 and
                 .rootfs_bytes<=16777216 and .removed_other_user_interfaces==true and
                 .physical_boot_verified==false and .signed==false and
                 .safe_to_flash==false and .kernel_modified==false and
                 .bootloader_payload==false and .recovery_payload==false and
                 .userdata_payload==false' verified/reader-candidate/reader-edition-report.json
          echo "$(jq -r .rootfs_sha256 verified/reader-candidate/reader-edition-report.json)  verified/reader-candidate/reader-rootfs.squashfs" | sha256sum -c -
          echo "$(jq -r .sd_payload_sha256 verified/reader-candidate/reader-edition-report.json)  verified/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs" | sha256sum -c -
          test "$(unsquashfs -cat verified/reader-candidate/reader-rootfs.squashfs etc/pocketos-release | grep '^UPDATE_SEQUENCE=')" = 'UPDATE_SEQUENCE=6'
          unsquashfs -cat verified/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs ffi/posix_h.lua |
            grep -Fq 'linux_gnu_mipsel='
      - name: Download exactly proven original PocketOS R1 kernel (no kernel changes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original original-iso baseline
          gh release download pocketos-test-2 --repo "$GITHUB_REPOSITORY" --dir original --pattern pocketos-r1.upt
          echo '1ba912c86e50d699085657ee28b357db32b27b793b09bc1d0a9ca93c88899b80  original/pocketos-r1.upt' | sha256sum -c -
          7z x -y -ooriginal-iso original/pocketos-r1.upt >/dev/null
          python3 tools/extract-r1-system-upt.py --extracted original-iso \
            --rootfs baseline/pocketos-rootfs.squashfs --kernel baseline/xImage \
            --rootfs-sha256 fd2a763277941163a8b52a767b3fdcfe96b3530107a6f72a30fe0ccce365da8a \
            --kernel-sha256 9222276c59d7bc9ffb8594106475b986bf66066c4f8f4db99c6fb34cb4fc64f6
      - name: Re-run native MIPS QEMU against the exact candidate to be signed
        run: |
          set -euo pipefail
          mkdir -p root runtime report
          unsquashfs -no-progress -d root verified/reader-candidate/reader-rootfs.squashfs >report/root-unpack.txt
          unsquashfs -no-progress -d runtime verified/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs >report/runtime-unpack.txt
          test "$(find runtime/plugins -mindepth 1 -maxdepth 1 -type d -name '*.koplugin' | wc -l)" -ge 37
          test ! -e runtime/plugins/gzreader.koplugin
          test ! -e runtime/plugins/zenos.koplugin
          grep -Fq 'linux_gnu_mipsel=' runtime/ffi/posix_h.lua
          ! grep -Fq 'linux_mipsel=' runtime/ffi/posix_h.lua
          bash tools/koreader-r1-deep-offline-test.sh root runtime report
          (
            cd runtime
            export KO_PLATFORM=hibyr1
            export KO_HOME="$GITHUB_WORKSPACE/KOReader-QEMU-Profile"
            export LD_LIBRARY_PATH="$PWD/libs:$PWD"
            mkdir -p "$KO_HOME"
            timeout 75 qemu-mipsel -L "$GITHUB_WORKSPACE/root" ./luajit ./reader.lua -h
          ) 2>&1 | tee report/reader-entry-help.txt
          grep -Eq 'usage:|Usage:|Read all the books' report/reader-entry-help.txt
          echo 'PASS: current exact candidate passed native MIPS QEMU; this is not a physical boot.' >>report/summary.txt
      - name: Re-audit disposable UPT layout and CI-only signature round-trip
        run: |
          set -euo pipefail
          mkdir -p offline-upt
          python3 - <<'PY'
          import importlib.util, json, pathlib
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location("upt", root/"tools/build-r1-upt.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          report = json.loads((root/"verified/reader-candidate/reader-edition-report.json").read_text())
          candidate = {"image":{"sha256":report["rootfs_sha256"]},
                       "primary_target":"/dev/mtd2 (rootfs)",
                       "kernel_reused":True,"build_id":report["source_commit"][:16]}
          result = mod.package(root/"verified/reader-candidate/reader-rootfs.squashfs", candidate,
                               root/"offline-upt/iso-stage", root/"offline-upt/pocketos-r1.upt",
                               root/"baseline/xImage")
          assert result["kernel_payload"] is True and result["kernel_unchanged"] is True
          assert result["kernel_target_when_in_software_recovery"] == "/dev/mtd1"
          assert result["rootfs_target_when_in_software_recovery"] == "/dev/mtd2"
          assert all(result[n] is False for n in ("bootloader_payload","recovery_payload","userdata_payload"))
          (root/"offline-upt/data-r1-report.json").write_text(json.dumps(result,indent=2)+"\n")
          print("PASS: exact current candidate assembled into a disposable UPT layout without flashing.")
          PY
          7z x -y -ooffline-upt/verify offline-upt/pocketos-r1.upt >report/upt-extract.txt
          test -f offline-upt/verify/ota_v0/ota_update.in
          grep -Fxq 'img_type=kernel' offline-upt/verify/ota_v0/ota_update.in
          grep -Fxq 'img_type=rootfs' offline-upt/verify/ota_v0/ota_update.in
          test "$(find offline-upt/verify/ota_v0 -name 'xImage.*' | wc -l)" -ge 2
          test "$(find offline-upt/verify/ota_v0 -name 'rootfs.squashfs.*' | wc -l)" -ge 10
          umask 077
          test_key="$RUNNER_TEMP/koreader-manifest-test.pem"
          test_public="$RUNNER_TEMP/koreader-manifest-test-public.pem"
          trap 'rm -f "$test_key" "$test_public"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$test_key" 2>report/test-key.log
          openssl pkey -in "$test_key" -pubout -out "$test_public"
          python3 apps/pack-update.py --firmware --sequence 6 --channel test --key "$test_key" \
            --output offline-upt/temporary-signature-test offline-upt/pocketos-r1.upt offline-upt/data-r1-report.json
          (
            cd offline-upt/temporary-signature-test
            test "$(head -n 1 manifest)" = 'POCKETOS-R1-SYSTEM-1 test r1-mipsel 6'
            openssl dgst -sha256 -verify "$test_public" -signature manifest.sig manifest
            tail -n +2 manifest | awk '{print $1 "  " $3}' | sha256sum -c -
          )
          echo 'PASS: temporary signature only; no production key used and nothing was flashed.' >>report/summary.txt
      - name: Require manual physical R1 verification and original PocketOS signing identity
        env:
          RELEASE_KEY: ${{ secrets.POCKETOS_RELEASE_KEY }}
          PREFLIGHT_LOG: ${{ secrets.POCKETOS_PREFLIGHT_LOG }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$RELEASE_KEY" ] && [ -n "$PREFLIGHT_LOG" ] || {
            echo "::error::Private signing key and physical R1 recovery preflight evidence required"; exit 1;
          }
          key="$RUNNER_TEMP/reader-r1-signing-key.pem"
          preflight="$RUNNER_TEMP/reader-r1-hardware-evidence.txt"
          trap 'rm -f "$key" "$preflight"' EXIT
          printf '%s\n' "$RELEASE_KEY" >"$key"
          printf '%s\n' "$PREFLIGHT_LOG" >"$preflight"
          unset RELEASE_KEY PREFLIGHT_LOG
          chmod 600 "$key"
          openssl pkey -in "$key" -check -noout >/dev/null
          for check in POCKETOS-R1-RECOVERY-PREFLIGHT-OK POCKETOS-R1-KOREADER-READONLY-SD-LOOP-OK; do
            grep -Fxq "$check" "$preflight" || {
              echo "::error::Missing approved real R1 preflight: $check"; exit 1;
            }
          done
          expected_sd_sha="$(jq -r .sd_payload_sha256 verified/reader-candidate/reader-edition-report.json)"
          grep -Fxq "POCKETOS-R1-KOREADER-SD-SHA256=$expected_sd_sha" "$preflight" || {
            echo "::error::Physical probe log does not attest the exact SD runtime being signed"; exit 1;
          }
          python3 tools/pack-r1-firmware-update.py \
            --rootfs verified/reader-candidate/reader-rootfs.squashfs \
            --candidate verified/reader-candidate/reader-edition-report.json \
            --kernel baseline/xImage \
            --sd-runtime verified/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs \
            --key "$key" --sequence 6 --channel test --reader-only \
            --output signed-stage
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/pocketos-signing-public.pem"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/pocketos-signing-public.pem" \
            -signature signed-stage/manifest.sig signed-stage/manifest
          (cd signed-stage &&
            test "$(head -n 1 manifest)" = 'POCKETOS-R1-SYSTEM-1 test r1-mipsel 6' &&
            tail -n +2 manifest | awk '{print $1 "  " $3}' | sha256sum -c -)
      - name: Add prominent warning and isolate uninstalled offline stage
        run: |
          set -euo pipefail
          mkdir -p stage-only
          cp signed-stage/manifest signed-stage/manifest.sig \
             signed-stage/pocketos-r1.upt signed-stage/data-r1-report.json stage-only/
          cp verified/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs stage-only/
          cat >stage-only/DO-NOT-INSTALL-UNTIL-DEVICE-BOOT-AND-ROLLBACK-VERIFIED.txt <<'EOF'
          Signed offline staging only, NOT a device-verified release!
          This is original upstream KOReader, NOT GZreader/ZenOS.
          No live R1 was rebooted or flashed by this workflow.
          Signing and immutable kernel verification are not evidence that
          display, touchscreen, RAM, cold boot or recovery/rollback works.
          Do not flash or add this package to the Wi-Fi update channel.
          The SD KOReader runtime must be copied byte-for-byte to the
          exact protected FAT32 path before any later approved device boot.
          EOF
          (cd stage-only && sha256sum * >SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: KOReader-R1-SIGNED-OFFLINE-STAGE-DO-NOT-INSTALL
          path: stage-only/
          retention-days: 7
          if-no-files-found: error
