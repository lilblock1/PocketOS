name: PocketOS Reader Edition - verify QEMU-passing RO-SD candidate (NOT FIRMWARE)
on:
  push:
    branches: [reader-edition-koreader]
    paths:
      - '.github/workflows/pocketos-reader-boot-candidate.yml'
      - 'tools/r1-koreader-loop-probe.sh'
      - 'tools/koreader-r1-deep-offline-test.sh'
      - 'docs/reader-edition-first-hardware-test.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pocketos-reader-boot-candidate-review
  cancel-in-progress: true
jobs:
  ro-sd-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Smoke-test the read-only hardware probe (host only; not R1 validation)
        shell: bash
        run: |
          set -euo pipefail
          probe=tools/r1-koreader-loop-probe.sh
          sh -n "$probe"
          test_output="$(sh "$probe" --self-test)"
          printf '%s\n' "$test_output"
          grep -Fxq 'PocketOS KOReader R1 read-only hardware probe v1' <<<"$test_output"

          usage_status=0
          usage_output="$(sh "$probe" 2>&1)" || usage_status=$?
          test "$usage_status" -eq 2
          grep -Fq 'Usage: sh r1-koreader-loop-probe.sh --audit|EXPECTED_SD_IMAGE_SHA256' <<<"$usage_output"

          # Exercise only the read-only inventory path on the hosted runner.
          # This is a shell smoke test, never evidence about physical R1 hardware.
          audit_output="$(sh "$probe" --audit)"
          grep -Fq 'AUDIT FINISHED; filesystem and boot image unchanged.' <<<"$audit_output"

          # Keep the safety-critical probe contract explicit in CI.
          grep -Fq 'noexec' "$probe"
          grep -Fq 'busybox mount -t squashfs -o ro,nosuid,nodev,loop,exec' "$probe"
          grep -Fq 'TARGET=hiby-r1' "$probe"
          if grep -Eq '(^|[[:space:]])(flash_erase|nandwrite|fw_setenv|reboot|dd)([[:space:]]|$)' "$probe"; then
            echo '::error::Unexpected firmware/reboot/write command in read-only probe.'
            exit 1
          fi
      - name: Install QEMU and image inspection tools with bounded retries
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! command -v qemu-mipsel >/dev/null; then
            timeout 540 sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
              install -y --no-install-recommends qemu-user
          fi
          for cmd in qemu-mipsel unsquashfs readelf sha256sum jq gh; do command -v "$cmd"; done
      - name: Authenticate the exact QEMU-tested standard KOReader candidate and boot audit
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_run=44460649797
          candidate_sha=f2ed849682cdd6ca076f7a5d2a954a179a7079cb
          qemu_run=44460728655
          qemu_sha=672a18bec0e0512675e96c6bd24c16189667ba03
          audit_run=44460896960
          audit_sha=8e0662876f5c84b0f04210878e1c674b7e156506

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run" |
            jq -e --arg sha "$candidate_sha" '
              .status=="completed" and .conclusion=="success" and
              .head_branch=="reader-edition-koreader" and .head_sha==$sha and
              .path==".github/workflows/pocketos-koreader-mips-ready-candidate.yml"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$qemu_run" |
            jq -e --arg sha "$qemu_sha" '
              .status=="completed" and .conclusion=="success" and
              .head_branch=="reader-edition-koreader" and .head_sha==$sha and
              .path==".github/workflows/pocketos-koreader-new-image-qemu.yml"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$audit_run" |
            jq -e --arg sha "$audit_sha" '
              .status=="completed" and .conclusion=="success" and
              .head_branch=="reader-edition-koreader" and .head_sha==$sha and
              .path==".github/workflows/pocketos-koreader-upt-boot-audit.yml"'

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run/artifacts" |
            jq -e '[.artifacts[]|select(
              .id==14500046462 and
              .name=="KOReader-R1-CORRECTED-MIPS-SD-AND-ROOTFS-NOT-FIRMWARE" and
              .digest=="sha256:e6115bb624cc19249fbcd5752ee21732620acb8b3437a9ce7c99c8ed1cfd787b" and
              .expired==false)]|length==1'

          git merge-base --is-ancestor "$candidate_sha" "$GITHUB_SHA"
          # Do not re-label a stale candidate as current if any code that
          # affects its ABI, native runtime, rootfs or QEMU test changed later.
          git diff --quiet "$candidate_sha" "$GITHUB_SHA" -- \
            .github/workflows/pocketos-koreader-mips-build.yml \
            .github/workflows/pocketos-koreader-mips-ffi.yml \
            .github/workflows/pocketos-koreader-mips-ready-candidate.yml \
            reader/koreader/normalize-mips-posix.py \
            reader/koreader/prepare-upstream.py \
            reader/koreader/overlay \
            reader/koreader/boot/pocketos-reader-start.sh \
            reader/koreader/r1-touch-probe.c \
            reader/koreader/build-reader-rootfs.py \
            tools/koreader-r1-deep-offline-test.sh || {
              echo "::error::The pinned QEMU candidate is stale relative to native/ABI sources; rebuild and retest before creating a hardware bundle."
              exit 1
            }
          echo "Candidate, QEMU and boot-chain provenance verified; runtime source files unchanged." 
      - uses: actions/download-artifact@v8
        with:
          name: KOReader-R1-CORRECTED-MIPS-SD-AND-ROOTFS-NOT-FIRMWARE
          run-id: 44460649797
          github-token: ${{ github.token }}
          path: verified
      - name: Verify candidate hashes, original KOReader identity and 16 MiB rootfs limit
        run: |
          set -euo pipefail
          mkdir -p root runtime report hardware-bundle
          jq -e '.reader_edition==true and .only_visible_ui=="KOReader" and
                 .sequence==6 and .installed_koreader_plugin_count>=37 and
                 .rootfs_bytes<=16777216 and .removed_other_user_interfaces==true and
                 .physical_boot_verified==false and .signed==false and
                 .safe_to_flash==false and .sd_runtime_required==true and
                 .sd_mount_noexec_preserved==true and
                 .bootloader_payload==false and .recovery_payload==false and
                 .userdata_payload==false and .kernel_modified==false' \
            verified/candidate/reader-edition-report.json
          echo "$(jq -r .rootfs_sha256 verified/candidate/reader-edition-report.json)  verified/candidate/reader-rootfs.squashfs" | sha256sum -c -
          echo "$(jq -r .sd_payload_sha256 verified/candidate/reader-edition-report.json)  verified/candidate/KOReader-R1-SD-RUNTIME.squashfs" | sha256sum -c -
          unsquashfs -no-progress -d root verified/candidate/reader-rootfs.squashfs >report/root-unpack.txt
          unsquashfs -no-progress -d runtime verified/candidate/KOReader-R1-SD-RUNTIME.squashfs >report/runtime-unpack.txt
          test "$(grep -c 'linux_gnu_mipsel=' runtime/ffi/posix_h.lua)" -eq 1
          ! grep -Fq 'linux_mipsel=' runtime/ffi/posix_h.lua
          ! grep -Fq 'unsupported platform: linux_gnu_mipsel' runtime/ffi/posix_h.lua
          test ! -e runtime/plugins/gzreader.koplugin
          test ! -e runtime/plugins/zenos.koplugin
          test -f runtime/reader.lua
          test -f runtime/frontend/device/hibyr1/device.lua
          test -x root/usr/bin/pocketos-start
          test "$(cat root/etc/pocketos/koreader-sd.sha256)" = \
            "$(jq -r .sd_payload_sha256 verified/candidate/reader-edition-report.json)  /mnt/sd_0/PocketOS/KOReaderRuntime/KOReader-R1-SD-RUNTIME.squashfs"
          echo 'PASS: exact candidate hashes, GNU MIPS ABI key, original KOReader frontend, 37+ plugins, protected SD manifest, no GZreader/ZenOS.'
      - name: Execute POSIX, framebuffer, input and RGB565 smoke under native MIPS QEMU
        run: |
          set -euo pipefail
          bash tools/koreader-r1-deep-offline-test.sh root runtime report
          (
            cd runtime
            export KO_PLATFORM=hibyr1
            export KO_HOME="$GITHUB_WORKSPACE/KOReader-QEMU-Profile"
            export LD_LIBRARY_PATH="$PWD/libs:$PWD"
            mkdir -p "$KO_HOME"
            timeout 75 qemu-mipsel -L "$GITHUB_WORKSPACE/root" ./luajit ./reader.lua -h
          ) 2>&1 | tee report/real-reader-entry-help.txt
          grep -Eq 'usage:|Usage:|Read all the books' report/real-reader-entry-help.txt
          echo 'PASS: original KOReader reader.lua help under MIPS QEMU; this is not a physical R1 boot.' >>report/summary.log
      - name: Package only the QEMU-verified candidate and safe read-only hardware probe
        run: |
          set -euo pipefail
          mkdir -p hardware-bundle/candidate
          cp verified/candidate/reader-rootfs.squashfs hardware-bundle/candidate/
          cp verified/candidate/KOReader-R1-SD-RUNTIME.squashfs hardware-bundle/candidate/
          cp verified/candidate/reader-edition-report.json hardware-bundle/candidate/
          cp tools/r1-koreader-loop-probe.sh hardware-bundle/
          cp docs/reader-edition-first-hardware-test.md hardware-bundle/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("hardware-bundle/reader-edition-first-hardware-test.md")
          s = p.read_text()
          old = "This script is **not** included inside the artifact ZIP."
          assert old not in s
          assert "Use the included `r1-koreader-loop-probe.sh`" in s
          p.write_text(s)
          PY
          cat >hardware-bundle/READ-THIS-FIRST-NOT-FIRMWARE.txt <<'EOF'
          QEMU-verified standard upstream KOReader R1 candidate.
          UNSIGNED, NOT INSTALLABLE, NOT FIRMWARE. Do not flash either SquashFS.
          The candidate/ folder contains the exact tested images and report.
          Only the SD runtime is used for the safe read-only probe on an
          already-booted independent PocketOS device. Keep the rootfs image
          on the PC. Follow reader-edition-first-hardware-test.md exactly.
          The probe verifies the SD hash, requires FAT32 noexec to remain set,
          mounts SquashFS read-only in volatile /run, runs only LuaJIT -v,
          then cleans up its temporary loop node and mount.
          No firmware, OTA channel, signature key or recovery data is changed.
          QEMU does not test the real LCD, touch controller, kernel loop driver,
          64 MiB RAM limit, physical cold boot, signing or rollback.
          EOF
          (cd hardware-bundle && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS)
          cat >report/PHYSICAL-GATES-REMAIN.txt <<'EOF'
          QEMU POSIX, framebuffer module, input module, RGB565 software buffer,
          and original reader.lua help passed.
          Still unverified on hardware: cold boot, /dev/fb0 pixels, touch/key
          mapping, kernel SquashFS+loop support, FAT32 noexec + read-only loop
          mount, RAM pressure, signing identity, recovery and rollback.
          No flash or OTA operation was performed.
          EOF
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: KOReader-R1-QEMU-VERIFIED-RO-SD-PREFLIGHT-NOT-FIRMWARE
          path: hardware-bundle/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: KOReader-R1-RO-SD-PREFLIGHT-REPORT-NOT-FIRMWARE
          path: report/
          retention-days: 14
          if-no-files-found: warn
