name: PocketOS - Optional audio decoder (no Linux rebuild)
on:
  push:
    branches: [main]
    paths: ['tools/build-audio-decoder.sh', 'tools/test-audio-decoder.py', '.github/workflows/pocketos-decoder.yml']
  workflow_dispatch:
    inputs:
      foundation_run_id:
        description: 'Existing foundation run with SDK (blank = discover)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pocketos-decoder
  cancel-in-progress: true
jobs:
  codecs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build and test utilities
        run: sudo apt-get update && sudo apt-get install -y gcc make curl gnupg xz-utils ffmpeg qemu-user pkg-config
      - name: Build restricted host decoder from authenticated source
        run: bash tools/build-audio-decoder.sh host "$PWD/codec-host-work" "$PWD/codec-host"
      - name: Test actual restricted host decoder
        run: python3 tools/test-audio-decoder.py "$PWD/codec-host/pocketos-ffmpeg"
      - name: Find reusable MIPS SDK
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.foundation_run_id }}
        run: python3 tools/select_sdk.py
      - name: Download matching SDK
        if: steps.pick.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: PocketOS-compiled-MIPS-SDK
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ github.token }}
          path: previous-sdk
      - name: Download matching rootfs
        if: steps.pick.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: PocketOS-0.1.0-alpha-foundation-NOT-FIRMWARE
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ github.token }}
          path: previous-foundation
      - name: Verify SDK and rootfs pair
        if: steps.pick.outputs.run_id != ''
        env:
          FOUNDATION_RUN: ${{ steps.pick.outputs.run_id }}
          FOUNDATION_COMMIT: ${{ steps.pick.outputs.commit }}
        run: |
          python3 tools/verify_sdk.py
          mkdir -p sdk rootfs
          tar -xzf previous-sdk/pocketos-sdk.tar.gz -C sdk --no-same-owner --no-same-permissions
          (cd sdk/pocketos-sdk && ./relocate-sdk.sh)
          tar -xzf previous-foundation/PocketOS-rootfs-NOT-FIRMWARE.tar.gz -C rootfs --no-same-owner --no-same-permissions --exclude='./dev/*' --exclude='dev/*'
      - name: Build MIPS audio decoder only
        if: steps.pick.outputs.run_id != ''
        run: |
          compiler=
          for candidate in "$PWD"/sdk/pocketos-sdk/bin/mipsel*-gcc; do
            if [ -x "$candidate" ]; then compiler="$candidate"; break; fi
          done
          test -n "$compiler"
          POCKETOS_CC="$compiler" bash tools/build-audio-decoder.sh mipsel "$PWD/codec-mips-work" "$PWD/codec-mips"
          cp previous-sdk/sdk-manifest.json codec-mips/
      - name: Test MIPS decoder against matching rootfs
        if: steps.pick.outputs.run_id != ''
        run: python3 tools/test-audio-decoder.py qemu-mipsel -L "$PWD/rootfs" "$PWD/codec-mips/pocketos-ffmpeg"
      - name: Upload optional audio decoder candidate (not firmware)
        if: steps.pick.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: PocketOS-R1-audio-decoder-NOT-FIRMWARE
          path: codec-mips/
          if-no-files-found: error
          retention-days: 30
      - name: Report SDK blocker
        if: steps.pick.outputs.run_id == ''
        run: echo "::notice::Host decoder only. MIPS candidate requires matching SDK export; no Linux rebuild was started."
