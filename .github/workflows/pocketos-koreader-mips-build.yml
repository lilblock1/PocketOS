name: PocketOS Reader Edition - Native KOReader MIPS Build
on:
  push:
    branches: [reader-edition-koreader]
    paths:
      - 'reader/koreader/**'
      - 'tools/extract-r1-system-upt.py'
      - 'tools/build-r1-upt.py'
      - 'tools/koreader-r1-deep-offline-test.sh'
      - 'apps/pack-update.py'
      - '.github/workflows/pocketos-koreader-mips-ffi.yml'
      - '.github/workflows/pocketos-koreader-mips-build.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pocketos-koreader-r1-native-mips
  cancel-in-progress: true
env:
  LUAJIT_SHA: 63c8f1a9b479ba5518cf6a170ff7729178bc3cfd
  KOREADER_SHA: 21cc368d388378b6fc8ecdbfc879d8f89c17eca1
jobs:
  mips-luajit:
    name: Cross-build native MIPS LuaJIT
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install cross-compiler and QEMU
        run: |
          # LuaJIT's 32-bit host generators need the matching i386 asm headers;
          # libc6-dev-i386 alone does not install linux-libc-dev:i386 on Ubuntu 24.04.
          sudo dpkg --add-architecture i386
          timeout 360 sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update
          timeout 600 sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu libc6-dev-mipsel-cross libc6-dev-i386 lib32gcc-13-dev linux-libc-dev:i386 qemu-user
      - name: Fetch pinned upstream LuaJIT and compile for R1 MIPS32 little-endian
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/LuaJIT/LuaJIT.git luajit-src
          git -C luajit-src checkout --detach "$LUAJIT_SHA"
          test "$(git -C luajit-src rev-parse HEAD)" = "$LUAJIT_SHA"
          make -C luajit-src -j2 HOST_CC="gcc -m32" CROSS=mipsel-linux-gnu- \
            TARGET_CC=mipsel-linux-gnu-gcc TARGET_LD=mipsel-linux-gnu-gcc \
            TARGET_SYS=Linux TARGET_FLAGS='-march=mips32r2 -mabi=32' \
            > luajit-compile.log 2>&1 || {
              tail -n 160 luajit-compile.log
              exit 1
            }
          mkdir -p mips-luajit
          cp luajit-src/src/luajit mips-luajit/luajit
          cp luajit-src/COPYRIGHT mips-luajit/COPYRIGHT
          cp luajit-src/src/libluajit.so* mips-luajit/ 2>/dev/null || true
          mipsel-linux-gnu-readelf -h mips-luajit/luajit > mips-luajit/elf.txt
          grep -q ELF32 mips-luajit/elf.txt
          grep -q 'little endian' mips-luajit/elf.txt
          grep -q MIPS mips-luajit/elf.txt
          timeout 30 qemu-mipsel -L /usr/mipsel-linux-gnu mips-luajit/luajit -v
          timeout 30 qemu-mipsel -L /usr/mipsel-linux-gnu \
            mips-luajit/luajit -e 'print("MIPS32 target:", jit.arch, jit.os); assert(jit.arch:match("^mips")); local ok, mod=pcall(require,"ffi"); assert(ok and type(mod)=="table", tostring(mod)); print("MIPS32 LuaJIT FFI: PASS")'
          cp luajit-compile.log mips-luajit/
          sha256sum mips-luajit/luajit > mips-luajit/SHA256SUMS
          echo 'MIPS32 LuaJIT research binary only. Native KOReader C libraries and hardware boot are not validated; NOT FIRMWARE.' > mips-luajit/README.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: KOReader-R1-MIPS-LuaJIT-PROTOTYPE-NOT-FIRMWARE
          path: |
            mips-luajit/
            luajit-compile.log
          if-no-files-found: warn
          retention-days: 14

  koreader-mips:
    name: Attempt complete native KOReader cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout pinned full KOReader and required submodules
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/koreader/koreader.git native-koreader
          git -C native-koreader checkout --detach "$KOREADER_SHA"
          test "$(git -C native-koreader rev-parse HEAD)" = "$KOREADER_SHA"
          git -C native-koreader submodule update --init --depth 1 --jobs 2 \
            base l10n resources/fonts
          # KOReader base contains the separately pinned crengine submodule.
          # Without recursive checkout, its document engine Makefile fails
          # before compilation because cr3gui/data/dict is absent.
          git -C native-koreader submodule update --init --recursive --depth 1 --jobs 2
          test "$(git -C native-koreader/base rev-parse HEAD)" = f64c3eb11049e9a75189f186d7345d97c07d87b9
          test -f native-koreader/base/thirdparty/kpvcrlib/crengine/Makefile ||
            test -d native-koreader/base/thirdparty/kpvcrlib/crengine/cr3gui/data
          test -f native-koreader/base/Makefile.defs
          test -d native-koreader/plugins
          python3 reader/koreader/prepare-upstream.py \
            --upstream native-koreader \
            --overlay reader/koreader/overlay
      - name: Install MIPS toolchain and KOReader host build dependencies
        run: |
          timeout 360 sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update
          timeout 600 sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends \
            gcc-mipsel-linux-gnu g++-mipsel-linux-gnu \
            binutils-mipsel-linux-gnu qemu-user cmake ninja-build meson \
            git make curl wget patch unzip zip python3 python3-pip \
            pkg-config gettext autoconf automake libtool \
            libtool-bin libssl-dev libjpeg-dev zlib1g-dev \
            libc6-dev-i386 lib32gcc-13-dev
      - name: Attempt native MIPS32 build of KOReader runtime and document engines
        run: |
          set -euo pipefail
          mkdir -p build-diagnostics
          # A failure here is useful porting evidence; never classify a
          # frontend-only Lua package as full KOReader or signed firmware.
          set +e
          timeout 1900 make -C native-koreader TARGET=hibyr1 \
            CHOST=mipsel-linux-gnu USE_NO_CCACHE=1 \
            PARALLEL_JOBS=2 CI=1 all \
            > build-diagnostics/native-build.log 2>&1
          rc=$?
          set -e
          echo "$rc" > build-diagnostics/native-build.exit
          tail -n 180 build-diagnostics/native-build.log
          if [ "$rc" -ne 0 ]; then
            echo "KOReader MIPS full native dependencies are not ready (exit $rc)."
            echo "No installable device firmware was created."
            exit "$rc"
          fi
      - name: Verify actual KOReader executable, full plugin tree and MIPS libraries
        if: success()
        run: |
          set -euo pipefail
          # Upstream's 'make all' stages binaries, Lua files and plugins as
          # symlinks. Plain 'find -type f' excludes the luajit symlink, and
          # packaging those symlinks would leave a broken standalone runtime.
          # The exact stage directory is defined by upstream Makefile as
          # koreader-$(TARGET)-$(TARGET_MACHINE); avoid traversing symlinked
          # build trees or selecting another nested luajit executable.
          app_dir="native-koreader/koreader-hibyr1-mipsel-linux-gnu/koreader"
          package="$app_dir/luajit"
          test -d "$app_dir"
          if [ ! -f "$package" ]; then
            echo "::error::Missing staged MIPS LuaJIT at $package" >&2
            find native-koreader -maxdepth 4 -name luajit -ls >&2
            exit 1
          fi
          test -x "$package"
          mipsel-linux-gnu-readelf -h "$package" | grep -q MIPS
          test -f "$app_dir/reader.lua"
          test -f "$app_dir/frontend/device/hibyr1/device.lua"
          test -f "$app_dir/frontend/device.lua"
          test -d "$app_dir/plugins"
          # 'plugins' is a symlink in the upstream install tree.
          plugin_count=$(find -L "$app_dir/plugins" -maxdepth 1 -type d -name '*.koplugin' | wc -l)
          echo "Upstream KOReader plugin directories: $plugin_count"
          test "$plugin_count" -ge 37
          # Test Lua CLI without touching target framebuffer/input devices.
          timeout 30 qemu-mipsel -L /usr/mipsel-linux-gnu \
            "$package" -e 'assert(jit.arch:match("^mips")); assert(type(require("ffi"))=="table"); print("KOReader R1 native Lua: PASS")'
          mkdir -p native-output
          # Dereference upstream staging links so the extracted prototype
          # does not depend on paths in the CI checkout.
          (cd "$app_dir"/.. && tar --dereference -czf "$GITHUB_WORKSPACE/native-output/KOReader-R1-MIPS-PROTOTYPE.tar.gz" koreader)
          # Materialize the listing once: grep -q on a tar pipe can fail
          # spuriously under pipefail when tar receives SIGPIPE.
          tar -tzf native-output/KOReader-R1-MIPS-PROTOTYPE.tar.gz > native-output/archive-entries.txt
          grep -Fxq koreader/reader.lua native-output/archive-entries.txt
          grep -Fxq koreader/luajit native-output/archive-entries.txt
          cp reader/koreader/boot/pocketos-reader-start.sh native-output/
          cp reader/koreader/r1-touch-probe.c native-output/
          echo 'Experimental user-space prototype. No installed device ABI, physical boot or recovered firmware verified. DO NOT FLASH.' > native-output/README.txt
          (cd native-output && sha256sum KOReader-R1-MIPS-PROTOTYPE.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: KOReader-R1-FULL-MIPS-BUILD-REVIEW-NOT-FIRMWARE
          path: |
            build-diagnostics/
            native-output/
          if-no-files-found: warn
          retention-days: 14

  reader-rootfs-candidate:
    name: Assemble KOReader-only replacement rootfs (unsigned, no flash)
    needs: koreader-mips
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install verified R1 rootfs inspection and MIPS tools
        run: |
          timeout 360 sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update
          timeout 600 sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends p7zip-full squashfs-tools genisoimage \
            gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu libc6-dev-mipsel-cross qemu-user
      - uses: actions/download-artifact@v8
        with:
          name: KOReader-R1-FULL-MIPS-BUILD-REVIEW-NOT-FIRMWARE
          path: compiled
      - name: Select a fresh successful compiler-generated GNU MIPS ABI artifact
        id: abi-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pocketos-koreader-mips-ffi.yml/runs?branch=reader-edition-koreader&status=completed&per_page=20")"
          selected=0
          while IFS=$'\t' read -r run_id head_sha; do
            [ -n "$run_id" ] || continue
            comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$head_sha...$GITHUB_SHA" 2>/dev/null)" || continue
            if ! jq -e '[.files[]?.filename | select(. == ".github/workflows/pocketos-koreader-mips-ffi.yml" or . == "reader/koreader/normalize-mips-posix.py")] | length == 0' <<<"$comparison" >/dev/null; then
              continue
            fi
            run_meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            # The run list is already scoped to the FFI workflow, but verify
            # the returned metadata too. Treat an unexpected/stale run as a
            # rejected candidate and continue searching instead of aborting.
            jq -e --arg sha "$head_sha" \
              '.path==".github/workflows/pocketos-koreader-mips-ffi.yml" and
               .head_branch=="reader-edition-koreader" and .head_sha==$sha and
               .status=="completed" and .conclusion=="success"' \
              <<<"$run_meta" >/dev/null || continue
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
            artifact="$(jq -c '[.artifacts[] | select(.name=="KOReader-R1-TRUE-MIPS-POSIX-CDEFS-RESEARCH-NOT-FIRMWARE" and .expired==false and (.digest|type=="string" and startswith("sha256:")))] | sort_by(.created_at) | last // empty' <<<"$artifacts")"
            [ -n "$artifact" ] || continue
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$(jq -r .id <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "artifact_digest=$(jq -r .digest <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "Selected fresh ABI run $run_id at $head_sha, artifact $(jq -r .id <<<"$artifact") digest $(jq -r .digest <<<"$artifact")"
            selected=1
            break
          done < <(jq -r '.workflow_runs[] | select(.status=="completed" and .conclusion=="success") | [.id,.head_sha] | @tsv' <<<"$runs")
          [ "$selected" -eq 1 ] || { echo "::error::No successful MIPS ABI artifact with unchanged compiler assertions/normalizer"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: KOReader-R1-TRUE-MIPS-POSIX-CDEFS-RESEARCH-NOT-FIRMWARE
          run-id: ${{ steps.abi-source.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ffi
          digest-mismatch: error
      - name: Extract complete KOReader runtime from same successful build
        run: |
          set -euo pipefail
          test -f compiled/native-output/KOReader-R1-MIPS-PROTOTYPE.tar.gz
          mkdir -p full-reader
          tar -xzf compiled/native-output/KOReader-R1-MIPS-PROTOTYPE.tar.gz \
            -C full-reader --no-same-owner --no-same-permissions
          test -f full-reader/koreader/reader.lua
          test -f full-reader/koreader/frontend/device/hibyr1/device.lua
          test -d full-reader/koreader/plugins
          test "$(find full-reader/koreader/plugins -maxdepth 1 -type d -name '*.koplugin' | wc -l)" -ge 37
      - name: Install verified compiler-generated GNU MIPS POSIX declarations
        run: |
          set -euo pipefail
          (cd ffi && sha256sum -c report/SHA256SUMS)
          test -s ffi/generated/posix_h.lua
          test -s ffi/generated/posix_h_linux_gnu_mipsel.lua
          test "$(grep -Fc 'linux_gnu_mipsel=' ffi/generated/posix_h.lua)" -eq 1
          ! grep -Fq 'linux_mipsel=' ffi/generated/posix_h.lua
          grep -Fq 'Automatically generated with' ffi/generated/posix_h.lua
          test -f full-reader/koreader/ffi/posix_h.lua
          cp ffi/generated/posix_h.lua full-reader/koreader/ffi/posix_h.lua
          grep -Fq 'linux_gnu_mipsel=' full-reader/koreader/ffi/posix_h.lua
          ! grep -Fq 'linux_mipsel=' full-reader/koreader/ffi/posix_h.lua
          test ! -e full-reader/koreader/plugins/zenos.koplugin
          test ! -e full-reader/koreader/plugins/gzreader.koplugin
          echo "PASS: exact compiler-generated GNU MIPS POSIX declarations installed; no GZreader/ZenOS files"
      - name: Download and pin independently booted PocketOS system 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original original-iso baseline
          gh release download pocketos-test-2 \
            --repo "$GITHUB_REPOSITORY" --dir original --pattern pocketos-r1.upt
          echo '1ba912c86e50d699085657ee28b357db32b27b793b09bc1d0a9ca93c88899b80  original/pocketos-r1.upt' |
            sha256sum -c -
          7z x -y -ooriginal-iso original/pocketos-r1.upt >/dev/null
          python3 tools/extract-r1-system-upt.py \
            --extracted original-iso \
            --rootfs baseline/pocketos-rootfs.squashfs \
            --kernel baseline/xImage \
            --rootfs-sha256 fd2a763277941163a8b52a767b3fdcfe96b3530107a6f72a30fe0ccce365da8a \
            --kernel-sha256 9222276c59d7bc9ffb8594106475b986bf66066c4f8f4db99c6fb34cb4fc64f6
      - name: Cross-build native touch probe and verify ABI
        run: |
          set -euo pipefail
          mkdir -p tool-output
          mipsel-linux-gnu-gcc -static -Os -Wall -Wextra -Werror \
            reader/koreader/r1-touch-probe.c -o tool-output/pocketos-r1-touch-probe
          timeout 30 qemu-mipsel tool-output/pocketos-r1-touch-probe --self-test |
            grep -Fx 'PocketOS KOReader R1 touch probe v1'
      - name: Replace old user interface with KOReader inside candidate rootfs
        run: |
          set -euo pipefail
          python3 reader/koreader/build-reader-rootfs.py \
            --baseline baseline/pocketos-rootfs.squashfs \
            --koreader full-reader/koreader \
            --probe tool-output/pocketos-r1-touch-probe \
            --launcher reader/koreader/boot/pocketos-reader-start.sh \
            --output reader-candidate --sequence 6 \
            --source-commit "$GITHUB_SHA"
          jq -e '.reader_edition==true and .only_visible_ui=="KOReader" and
                  .sequence==6 and .installed_koreader_plugin_count>=37 and
                  .sd_runtime_required==true and
                  .sd_runtime_path=="/mnt/sd_0/PocketOS/KOReaderRuntime/KOReader-R1-SD-RUNTIME.squashfs" and
                  .sd_runtime_mount_path=="/run/pocketos-reader" and
                  .sd_runtime_format=="read-only-squashfs-lzo" and
                  .sd_mount_noexec_preserved==true and
                  .requires_kernel_loop_support==true and
                  .sd_runtime_file_count>100 and
                  .sd_manifest_file_count==1 and
                  .sd_payload_bytes>0 and
                  .removed_other_user_interfaces==true and
                  .bootloader_payload==false and .recovery_payload==false and
                  .userdata_payload==false and .kernel_modified==false and
                  .signed==false and .safe_to_flash==false and
                  .rootfs_bytes<=16777216' reader-candidate/reader-edition-report.json
          test "$(unsquashfs -cat reader-candidate/reader-rootfs.squashfs \
                    etc/pocketos-release | grep '^UPDATE_SEQUENCE=')" = 'UPDATE_SEQUENCE=6'
          test "$(unsquashfs -cat reader-candidate/reader-rootfs.squashfs \
                    usr/bin/pocketos-start | grep -Fc 'exec ./luajit ./reader.lua')" -ge 1
          test "$(unsquashfs -cat reader-candidate/reader-rootfs.squashfs \
                    usr/bin/pocketos-start | grep -Fc 'sha256sum -c "$manifest"')" -ge 1
          test -s reader-candidate/KOReader-R1-SD-RUNTIME.squashfs
          echo "$(jq -r '.sd_payload_sha256' reader-candidate/reader-edition-report.json)  reader-candidate/KOReader-R1-SD-RUNTIME.squashfs" | sha256sum -c -
          test "$(unsquashfs -cat reader-candidate/reader-rootfs.squashfs etc/pocketos/koreader-sd.sha256 | wc -l)" -eq 1
          test "$(unsquashfs -cat reader-candidate/reader-rootfs.squashfs etc/pocketos/koreader-runtime-files.sha256 | wc -l)" -gt 100
          unsquashfs -cat reader-candidate/reader-rootfs.squashfs etc/pocketos/koreader-sd.sha256 | grep -Fq '/mnt/sd_0/PocketOS/KOReaderRuntime/KOReader-R1-SD-RUNTIME.squashfs'
          unsquashfs -ls reader-candidate/KOReader-R1-SD-RUNTIME.squashfs > reader-candidate/SD-IMAGE-CONTENTS.txt
          grep -Fq 'squashfs-root/luajit' reader-candidate/SD-IMAGE-CONTENTS.txt
          grep -Fq 'squashfs-root/frontend/device/hibyr1/device.lua' reader-candidate/SD-IMAGE-CONTENTS.txt
          test "$(grep -c '\.koplugin' reader-candidate/SD-IMAGE-CONTENTS.txt)" -ge 37
          unsquashfs -cat reader-candidate/reader-rootfs.squashfs usr/bin/pocketos-start | grep -Fq 'mount -t squashfs -o ro,nosuid,nodev,loop,exec'
          # No older user-facing applications may survive.
          for path in usr/bin/pocketos-shell usr/bin/pocketos-music usr/bin/pocketos-game; do
            if unsquashfs -ls reader-candidate/reader-rootfs.squashfs |
               grep -Fqx "squashfs-root/$path"; then
              echo "Old UI or media executable survived: $path" >&2
              exit 1
            fi
          done
          echo 'Candidate is UNSIGNED and NOT SAFE TO FLASH; signing and hardware verification remain separately required.'
      - name: Run QEMU POSIX, framebuffer, input and RGB565 tests on this exact candidate
        run: |
          set -euo pipefail
          mkdir -p qemu-check/root qemu-check/runtime
          echo "$(jq -r .rootfs_sha256 reader-candidate/reader-edition-report.json)  reader-candidate/reader-rootfs.squashfs" | sha256sum -c -
          echo "$(jq -r .sd_payload_sha256 reader-candidate/reader-edition-report.json)  reader-candidate/KOReader-R1-SD-RUNTIME.squashfs" | sha256sum -c -
          unsquashfs -no-progress -d qemu-check/root reader-candidate/reader-rootfs.squashfs >qemu-check/root-extract.log
          unsquashfs -no-progress -d qemu-check/runtime reader-candidate/KOReader-R1-SD-RUNTIME.squashfs >qemu-check/runtime-extract.log
          bash tools/koreader-r1-deep-offline-test.sh qemu-check/root qemu-check/runtime qemu-check/report
          grep -Fxq 'PASS: native MIPS KOReader modules, software RGB565 and entry under QEMU' qemu-check/report/summary.log
          echo "PASS: this exact unsigned candidate passed native MIPS QEMU POSIX/framebuffer/input/RGB565 checks" | tee qemu-check/report/CANDIDATE-QEMU-PASS.txt
      - name: Validate disposable offline UPT layout and signature format without publishing
        run: |
          set -euo pipefail
          mkdir -p bootchain-report offline-upt
          python3 - <<'PY'
          import importlib.util, json, pathlib
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location("r1_upt", root / "tools/build-r1-upt.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          report = json.loads((root / "reader-candidate/reader-edition-report.json").read_text())
          candidate = {
              "image": {"sha256": report["rootfs_sha256"]},
              "primary_target": "/dev/mtd2 (rootfs)",
              "kernel_reused": True,
              "build_id": report["source_commit"][:16],
          }
          result = module.package(
              root / "reader-candidate/reader-rootfs.squashfs",
              candidate,
              root / "offline-upt/iso-stage",
              root / "offline-upt/pocketos-r1.upt",
              root / "baseline/xImage",
          )
          assert result["kernel_payload"] is True
          assert result["kernel_unchanged"] is True
          assert result["rootfs_sha256"] == report["rootfs_sha256"]
          assert result["bootloader_payload"] is False
          assert result["recovery_payload"] is False
          assert result["userdata_payload"] is False
          assert result["cold_boot_verified"] is False
          (root / "bootchain-report/unsigned-upt-layout.json").write_text(json.dumps(result, indent=2) + "\n")
          print("PASS: temporary unsigned UPT layout uses exact existing kernel; no device interaction")
          PY
          7z x -y -ooffline-upt/verify offline-upt/pocketos-r1.upt >bootchain-report/upt-extract.log
          test -f offline-upt/verify/ota_v0/ota_update.in
          grep -Fxq 'img_type=kernel' offline-upt/verify/ota_v0/ota_update.in
          grep -Fxq 'img_type=rootfs' offline-upt/verify/ota_v0/ota_update.in
          test "$(find offline-upt/verify/ota_v0 -name 'xImage.*' | wc -l)" -ge 2
          test "$(find offline-upt/verify/ota_v0 -name 'rootfs.squashfs.*' | wc -l)" -ge 10
          umask 077
          test_key="$RUNNER_TEMP/koreader-manifest-unit-test.pem"
          test_public="$RUNNER_TEMP/koreader-manifest-unit-test-public.pem"
          trap 'rm -f "$test_key" "$test_public"; rm -rf offline-upt' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$test_key" 2>bootchain-report/ephemeral-key-generation.log
          openssl pkey -in "$test_key" -pubout -out "$test_public"
          cp bootchain-report/unsigned-upt-layout.json offline-upt/data-r1-report.json
          python3 apps/pack-update.py --firmware --sequence 6 --channel test --key "$test_key" --output offline-upt/temporary-signature-test offline-upt/pocketos-r1.upt offline-upt/data-r1-report.json
          (
            cd offline-upt/temporary-signature-test
            test "$(head -n 1 manifest)" = 'POCKETOS-R1-SYSTEM-1 test r1-mipsel 6'
            openssl dgst -sha256 -verify "$test_public" -signature manifest.sig manifest
            tail -n +2 manifest | awk '{print $1 "  " $3}' | sha256sum -c -
          )
          echo "PASS: disposable manifest signature round-trip; test key is not the device trust key" >bootchain-report/signature-test.txt
          echo "No UPT or signature-test output is uploaded; no OTA channel, key, recovery or device was changed."
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE
          path: |
            reader-candidate/
            qemu-check/report/
            bootchain-report/
          retention-days: 14
          if-no-files-found: error
