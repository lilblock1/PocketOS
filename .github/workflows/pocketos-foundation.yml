name: PocketOS - Alpha foundation (NOT FIRMWARE)
on:
  push:
    branches: [main]
    paths: ['boards/**', 'tools/audit.py', 'tools/configure_abi.py', 'tools/extract_reference.py', '.github/workflows/pocketos-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocketos-foundation
  cancel-in-progress: false

jobs:
  foundation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pocketos-build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build and examination tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git rsync bc bzip2 cpio unzip file wget curl libncurses-dev python3 perl patch binutils bison flex gawk texinfo qemu-user p7zip-full squashfs-tools libssl-dev
      - name: Verify immutable R1 reference and determine ABI
        run: |
          url=$(python3 -c 'import json;print(json.load(open("boards/hiby-r1/reference.json"))["reference"]["url"])')
          curl --fail --location --retry 3 "$url" -o reference.upt
          python3 tools/extract_reference.py reference.upt boards/hiby-r1/reference.json reference-work
          sudo unsquashfs -no-progress -no-xattrs -d reference-work/root reference-work/reference.squashfs
          python3 tools/configure_abi.py reference-work/root boards/hiby-r1/pocketos_defconfig "$PWD/generated-defconfig"
      - name: Check out pinned Buildroot
        uses: actions/checkout@v4
        with:
          repository: buildroot/buildroot
          ref: 137a566bf5353831d97c068a4c22e6df5b4d07a0
          path: buildroot-src
          persist-credentials: false
      - name: Restore cached upstream source archives
        uses: actions/cache@v4
        with:
          path: buildroot-src/dl
          key: pocketos-downloads-137a566b-linux44-v1
      - name: Verify Linux 4.4 archive and version-specific license
        run: |
          # Archive SHA-256 from kernel.org/pub/linux/kernel/v4.x/sha256sums.asc.
          # The pre-SPDX 4.4 COPYING file contains the complete GPLv2 and
          # syscall exception; modern kernel LICENSES/* files do not exist.
          mkdir -p buildroot-src/dl/linux
          archive=buildroot-src/dl/linux/linux-4.4.302.tar.xz
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.4.302.tar.xz -o "$archive"
          fi
          printf '%s  %s\n' '35017bb40b604e0b577fc2b87e727632b46608a2ba3a4f5858b9177f58f376b3' "$archive" | sha256sum --check
          curl --fail --location --retry 3 https://raw.githubusercontent.com/gregkh/linux/a09b2d8f61ea0e9ae735c400399b97966a9418d6/COPYING -o linux44-COPYING
          printf '%s  linux44-COPYING\n' 'af8067302947c01fd9eee72befa54c7e3ef8a48fecde7fd71277f2290b2bf0f7' | sha256sum --check
          tar -xOf "$archive" linux-4.4.302/COPYING | cmp - linux44-COPYING
          python3 - <<'PY'
          from pathlib import Path
          p = Path('buildroot-src/package/linux-headers/linux-headers.hash')
          s = p.read_text()
          old = 'sha256  fb5a425bd3b3cd6071a3a9aff9909a859e7c1158d54d32e07658398cd67eb6a0  COPYING'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'sha256  af8067302947c01fd9eee72befa54c7e3ef8a48fecde7fd71277f2290b2bf0f7  COPYING') +
              '\nsha256  35017bb40b604e0b577fc2b87e727632b46608a2ba3a4f5858b9177f58f376b3  linux-4.4.302.tar.xz\n')
          config = Path('generated-defconfig')
          with config.open('a') as f:
              f.write('\nBR2_PACKAGE_HOST_LINUX_HEADERS_LICENSE_FILES="COPYING"\n')
          PY
      - name: Restore compiled object cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildroot-ccache
          key: pocketos-ccache-v1-ubuntu24-137a566b-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pocketos-ccache-v1-ubuntu24-137a566b-
      - name: Enable Buildroot compiler caching
        run: |
          printf '\nBR2_CCACHE=y\nBR2_CCACHE_INITIAL_SETUP="--max-size=2G"\nBR2_CCACHE_USE_BASEDIR=y\n' >> generated-defconfig
      - name: Configure minimal MIPS Linux userspace
        run: |
          make -C buildroot-src O="$PWD/buildroot-output" BR2_DEFCONFIG="$PWD/generated-defconfig" defconfig
          config=buildroot-output/.config
          for symbol in BR2_mipsel BR2_mips_32r2 BR2_TOOLCHAIN_BUILDROOT_GLIBC BR2_PACKAGE_HOST_LINUX_HEADERS_CUSTOM_4_4 BR2_INIT_BUSYBOX BR2_TARGET_ROOTFS_TAR_GZIP; do
            grep -qx "$symbol=y" "$config"
          done
          grep -qx 'BR2_DEFAULT_KERNEL_VERSION="4.4.302"' "$config"
          grep -qx 'BR2_PACKAGE_HOST_LINUX_HEADERS_LICENSE_FILES="COPYING"' "$config"
          if grep -qx 'BR2_LINUX_KERNEL=y' "$config"; then exit 1; fi
          if grep -qx 'BR2_MIPS_SOFT_FLOAT=y' generated-defconfig; then
            grep -qx 'BR2_MIPS_SOFT_FLOAT=y' "$config"
          else
            grep -qx '# BR2_MIPS_SOFT_FLOAT is not set' "$config"
            for symbol in BR2_MIPS_FP32_MODE_32 BR2_MIPS_FP32_MODE_XX BR2_MIPS_FP32_MODE_64; do
              if grep -qx "$symbol=y" generated-defconfig; then grep -qx "$symbol=y" "$config"; fi
            done
          fi
      - name: Compile independent Linux root filesystem
        run: |
          make -C buildroot-src O="$PWD/buildroot-output" -j"$(nproc)"
          test -s buildroot-output/images/rootfs.tar.gz
      - name: Report compiled object cache statistics
        if: always()
        run: |
          if test -x buildroot-output/host/bin/ccache; then
            buildroot-output/host/bin/ccache --show-stats
          fi
      - name: Persist compiled object cache
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: pocketos-ccache-v1-ubuntu24-137a566b-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Execute MIPS userspace and audit compatibility
        run: |
          mkdir -p foundation-artifact
          root="$PWD/buildroot-output/target"
          timeout 30 qemu-mipsel -L "$root" "$root/bin/busybox" true
          timeout 30 qemu-mipsel -L "$root" "$root/bin/busybox" sh -c 'test "$(echo PocketOS)" = PocketOS'
          grep -qx 'NAME=PocketOS' "$root/etc/pocketos-release"
          sudo python3 tools/audit.py reference-work/root "$root" foundation-artifact/compatibility.json buildroot-output/images/rootfs.tar.gz reference-work/reference.squashfs
          sudo chown "$(id -u):$(id -g)" foundation-artifact/compatibility.json
          cp buildroot-output/images/rootfs.tar.gz foundation-artifact/PocketOS-rootfs-NOT-FIRMWARE.tar.gz
          cp buildroot-output/.config foundation-artifact/buildroot.config
          cp boards/hiby-r1/reference.json README.md foundation-artifact/
          (cd foundation-artifact && sha256sum PocketOS-rootfs-NOT-FIRMWARE.tar.gz > SHA256SUMS)
      - name: Collect dependency license and source materials
        run: make -C buildroot-src O="$PWD/buildroot-output" legal-info
      - name: Export reusable compiled MIPS toolchain SDK
        env:
          FOUNDATION_COMMIT: ${{ github.sha }}
          FOUNDATION_RUN: ${{ github.run_id }}
        run: |
          make -C buildroot-src O="$PWD/buildroot-output" BR2_SDK_PREFIX=pocketos-sdk sdk
          mkdir -p sdk-artifact
          cp buildroot-output/images/pocketos-sdk.tar.gz sdk-artifact/
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def sha(p):
              with open(p,'rb') as stream: return hashlib.file_digest(stream,'sha256').hexdigest()
          a=Path('foundation-artifact')
          s=Path('sdk-artifact')
          fs=a/'PocketOS-rootfs-NOT-FIRMWARE.tar.gz'
          sdk=s/'pocketos-sdk.tar.gz'
          report=json.loads((a/'compatibility.json').read_text())
          assert report['flashable'] is False and report['fp_abi_matches']
          stamp={'schema':1,'flashable':False,'commit':os.environ['FOUNDATION_COMMIT'],
                 'run_id':int(os.environ['FOUNDATION_RUN']),
                 'config_sha256':sha(a/'buildroot.config'),'rootfs_sha256':sha(fs),
                 'reference_sha256':sha(a/'reference.json'),'sdk_sha256':sha(sdk)}
          assert stamp['rootfs_sha256']==report['candidate_tar_gz']['sha256']
          (s/'sdk-manifest.json').write_text(json.dumps(stamp,indent=2)+'\n')
          PY
      - name: Upload reusable compiler and target sysroot (not firmware)
        uses: actions/upload-artifact@v4
        with:
          name: PocketOS-compiled-MIPS-SDK
          path: sdk-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Upload explicitly non-flashable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketOS-0.1.0-alpha-foundation-NOT-FIRMWARE
          path: foundation-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Upload source and license materials
        uses: actions/upload-artifact@v4
        with:
          name: PocketOS-alpha-legal-info
          path: buildroot-output/legal-info/
          if-no-files-found: error
          retention-days: 14
