name: PocketOS R1 - standard KOReader true MIPS QEMU integration (NOT FIRMWARE)
on:
  push:
    branches: [reader-edition-koreader]
    paths:
      - '.github/workflows/pocketos-koreader-verified-mips-integration.yml'
      - 'tools/koreader-r1-deep-offline-test.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  standard-koreader-mips:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install only MIPS QEMU emulator and host ELF inspection
        timeout-minutes: 10
        run: |
          set -euo pipefail
          command -v unsquashfs
          command -v readelf
          if ! command -v qemu-mipsel >/dev/null; then
            timeout 520 sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=75 \
              install -y --no-install-recommends qemu-user
          fi
          command -v qemu-mipsel
      - name: Select latest successful current-source native KOReader candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pocketos-koreader-mips-build.yml/runs?branch=reader-edition-koreader&status=completed&per_page=50")"
          selected=0
          while IFS=$'\t' read -r run_id head_sha; do
            [ -n "$run_id" ] || continue
            git merge-base --is-ancestor "$head_sha" "$GITHUB_SHA" || continue
            git diff --quiet "$head_sha" "$GITHUB_SHA" -- \
              .github/workflows/pocketos-koreader-mips-build.yml \
              .github/workflows/pocketos-koreader-mips-ffi.yml \
              reader/koreader/normalize-mips-posix.py \
              reader/koreader/prepare-upstream.py \
              reader/koreader/overlay \
              reader/koreader/boot/pocketos-reader-start.sh \
              reader/koreader/r1-touch-probe.c \
              reader/koreader/build-reader-rootfs.py || continue
            meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            jq -e --arg sha "$head_sha" '.status=="completed" and .conclusion=="success" and .head_branch=="reader-edition-koreader" and .head_sha==$sha and .path==".github/workflows/pocketos-koreader-mips-build.yml"' <<<"$meta" >/dev/null || continue
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
            artifact="$(jq -c '[.artifacts[] | select(.name=="PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE" and .expired==false and (.digest|type=="string" and startswith("sha256:")))] | sort_by(.created_at) | last // empty' <<<"$artifacts")"
            [ -n "$artifact" ] || continue
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$(jq -r .id <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "artifact_digest=$(jq -r .digest <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "Selected native candidate run $run_id at $head_sha; artifact $(jq -r .id <<<"$artifact"), digest $(jq -r .digest <<<"$artifact")"
            selected=1
            break
          done < <(jq -r '.workflow_runs[] | select(.status=="completed" and .conclusion=="success" and .head_branch=="reader-edition-koreader" and .path==".github/workflows/pocketos-koreader-mips-build.yml") | [.id,.head_sha] | @tsv' <<<"$runs")
          [ "$selected" -eq 1 ] || { echo "::error::No successful native KOReader candidate matches current ABI/runtime/rootfs sources"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: PocketOS-Reader-KOReader-ONLY-ROOTFS-UNSIGNED-NOT-FIRMWARE
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: candidate
          digest-mismatch: error
      - name: Check original 37+ KOReader plugins, protected rootfs, generated GNU MIPS ABI
        run: |
          set -euo pipefail
          mkdir -p extracted/root extracted/runtime report
          echo "$(jq -r .rootfs_sha256 candidate/reader-candidate/reader-edition-report.json)  candidate/reader-candidate/reader-rootfs.squashfs" | sha256sum -c -
          echo "$(jq -r .sd_payload_sha256 candidate/reader-candidate/reader-edition-report.json)  candidate/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs" | sha256sum -c -
          jq -e --arg sha "${{ steps.candidate.outputs.head_sha }}" '.source_commit==$sha and .reader_edition==true and .only_visible_ui=="KOReader" and
                 .rootfs_bytes<=16777216 and .signed==false and
                 .safe_to_flash==false and .installed_koreader_plugin_count>=37' candidate/reader-candidate/reader-edition-report.json
          grep -Fq 'linux_gnu_mipsel=' extracted/runtime/ffi/posix_h.lua
          ! grep -Fq 'linux_mipsel=' extracted/runtime/ffi/posix_h.lua
          ! grep -Fq 'unsupported platform: linux_gnu_mipsel' extracted/runtime/ffi/posix_h.lua
          unsquashfs -no-progress -d extracted/root candidate/reader-candidate/reader-rootfs.squashfs >report/unsquashfs-root.log
          unsquashfs -no-progress -d extracted/runtime candidate/reader-candidate/KOReader-R1-SD-RUNTIME.squashfs >report/unsquashfs-runtime.log
          plugins=$(find extracted/runtime/plugins -mindepth 1 -maxdepth 1 -type d -name '*.koplugin' | wc -l)
          [ "$plugins" -ge 37 ]
          test ! -e extracted/runtime/plugins/zenos.koplugin
          test ! -e extracted/runtime/plugins/gzreader.koplugin
          echo "PASS: $plugins original KOReader plugin folders; GNU MIPS FFI installed only into extracted CI runtime" > report/identity.txt
      - name: Verify original KOReader native graphics, evdev, libc, RGB565 and startup in MIPS QEMU
        run: |
          set -euo pipefail
          bash tools/koreader-r1-deep-offline-test.sh extracted/root extracted/runtime report
      - name: Record that real HiBy R1 cold boot remains unverified
        if: always()
        run: |
          mkdir -p report
          cat >report/NO-BOOT-CLAIM.txt <<'EOF'
          Standard upstream KOReader MIPS user-mode integration test only.
          No GZreader or ZenOS interface is shipped or imported.
          Tested: MIPS ABI / native modules / offscreen RGB565 / startup chain.
          Not tested: physical R1 loop mount, /dev/fb0 pixels, touch events,
          RAM pressure, whole reader UI, recovery, firmware signing and cold boot.
          The original source artifact and update channels are unchanged.
          NOT FLASHABLE, DO NOT INSTALL THE ROOTFS IMAGE.
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: KOReader-R1-TRUE-MIPS-NATIVE-GRAPHICS-INPUT-REPORT-NOT-FIRMWARE
          path: report/
          retention-days: 14
